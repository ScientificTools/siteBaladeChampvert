<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Redirection mobile</title>
<script>
  (function () {
    const currentUrl = new URL(window.location.href);
    const targetUrl = new URL('./mobile/', currentUrl);
    const requestedView = (currentUrl.searchParams.get('view') || '').toLowerCase();

    if (requestedView === 'desktop') {
      targetUrl.searchParams.set('view', 'desktop');
    }

    window.location.replace(targetUrl.toString());
  })();
</script>
</head>
<body>
</body>
</html>
