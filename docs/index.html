  let backgroundEntries = [];
  let diaporamaEntries = [];
  let diaporamaActive = false;
  let activeDiaporamaVideoIndex = 0;
  let activeDiaporamaEntryIndex = -1;
  let diaporamaCycleOrder = [];
  let diaporamaCycleCursor = 0;
  let diaporamaCycleKey = '';
  let diaporamaSwitchTimerId = null;
  let diaporamaTransitionToken = 0;

  function getStrings() {
    return STRINGS[currentLocale] || STRINGS.FR;
  }

  function setPreferredView(view) {
    try {
      localStorage.setItem(VIEW_PREF_KEY, view);
    } catch (error) {}
  }

  function getPreferredText(list, fallback = '') {
    if (!Array.isArray(list)) return fallback;
    const match = list.find((entry) => Object.prototype.hasOwnProperty.call(entry, currentLocale) && entry[currentLocale] && entry[currentLocale] !== '_');
    if (match) return match[currentLocale];
    const fr = list.find((entry) => Object.prototype.hasOwnProperty.call(entry, 'FR') && entry.FR && entry.FR !== '_');
    if (fr) return fr.FR;
    return fallback;
  }

  function getScientificName(list) {
    if (!Array.isArray(list)) return '';
    const match = list.find((entry) => Object.prototype.hasOwnProperty.call(entry, 'SC') && entry.SC && entry.SC !== '_');
    return match ? match.SC : '';
  }

  function normalizeVariants(image) {
    const mainVariant = {
      webm: image.webm && image.webm !== '_' ? `${MEDIA_PREFIX}${image.webm}` : '',
      jpeg: image.jpeg && image.jpeg !== '_' ? `${MEDIA_PREFIX}${image.jpeg}` : '',
      poeticText: getPreferredText(image.poeticText, ''),
      scientificText: getPreferredText(image.scientificText, ''),
      latitude: image.latitude,
      longitude: image.longitude,
      date: image.date
    };
    const variants = [mainVariant];
    if (Array.isArray(image.otherImage)) {
      image.otherImage.forEach((other) => {
        if (!other || typeof other !== 'object') return;
        variants.push({
          webm: other.webm && other.webm !== '_' ? `${MEDIA_PREFIX}${other.webm}` : '',
          jpeg: other.jpeg && other.jpeg !== '_' ? `${MEDIA_PREFIX}${other.jpeg}` : mainVariant.jpeg,
          poeticText: getPreferredText(other.poeticText, mainVariant.poeticText),
          scientificText: getPreferredText(other.scientificText, mainVariant.scientificText),
          latitude: other.latitude,
          longitude: other.longitude,
          date: other.date
        });
      });
    }
    return variants;
  }

  function parseSoundInfo(image) {
    const isUsable = (value) => typeof value === 'string' && value.trim() && value.trim() !== '_';
    const raw = Array.isArray(image.liensSon) ? image.liensSon : [];
    const href = isUsable(raw[0]) ? raw[0].trim() : '';
    const file = isUsable(image.fichierSon) ? image.fichierSon.trim() : '';
    const external = String(image.provenanceExterne || '').trim().toLowerCase() === 'yes';
    return {
      links: href ? [{ href, label: isUsable(raw[1]) ? raw[1].trim() : href }] : [],
      soundSrc: file ? `${SOUND_PREFIX}${encodeURIComponent(file)}` : '',
      soundExternal: external,
      soundDetails: external && isUsable(image.detailsProvenanceExterne) ? image.detailsProvenanceExterne.trim() : ''
    };
  }

  function normalizeEntries(images) {
    return images.map((image, index) => ({
      id: `species-${index}`,
      category: image.category || '',
      title: getPreferredText(image.name, 'Observation'),
      scientific: getScientificName(image.name),
      thumb: image.jpeg && image.jpeg !== '_' ? `${MEDIA_PREFIX}${image.jpeg}` : '',
      ...parseSoundInfo(image),
      variants: normalizeVariants(image)
    }));
  }

  function updateSpeciesSoundButton() {
    const strings = getStrings();
    const audioPlaying = !speciesAudio.paused && !speciesAudio.ended;
    const playing = audioPlaying && speciesAudioEntryId === selectedId;
    speciesSoundBtn.classList.toggle('active', playing);
    speciesSoundBtn.setAttribute('aria-pressed', String(playing));
    speciesSoundBtn.setAttribute('aria-label', playing ? strings.soundStop : strings.soundPlay);
    document.querySelectorAll('.card-sound-btn').forEach((btn) => {
      const active = audioPlaying && btn.dataset.entryId === speciesAudioEntryId;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
      btn.setAttribute('aria-label', active ? strings.soundStop : strings.soundPlay);
    });
  }

  function stopSpeciesSound() {
    speciesAudio.pause();
    speciesAudio.removeAttribute('src');
    speciesAudio.load();
    updateSpeciesSoundButton();
  }

  function syncDiaporamaSpeciesSound() {
    if (!diaporamaActive) return;

    const entry = diaporamaEntries[activeDiaporamaEntryIndex];
    if (!audioToggleBtn.classList.contains('active') || !entry?.soundSrc) {
      stopSpeciesSound();
      speciesAudioEntryId = null;
      return;
    }

    speciesAudioEntryId = entry.soundEntryId || entry.id;
    speciesAudio.src = entry.soundSrc;
    speciesAudio.volume = backgroundAudio.volume;
    speciesAudio.play().catch((error) => console.warn('Impossible de démarrer le son de l\'espèce :', error));
    updateSpeciesSoundButton();
  }

  function formatDate(value) {
    const strings = getStrings();
    if (!value || value === '_') return strings.noDate;
    return value;
  }

  function getMapLink(latitude, longitude) {
    if (!latitude || !longitude || latitude === '_' || longitude === '_') return '';
    return `${MAP_LINK_BASE}?mlat=${encodeURIComponent(latitude)}&mlon=${encodeURIComponent(longitude)}#map=18/${encodeURIComponent(latitude)}/${encodeURIComponent(longitude)}`;
  }

  function applyStaticStrings() {
    const strings = getStrings();
    document.documentElement.lang = currentLocale === 'FR' ? 'fr' : 'en';
    document.title = currentLocale === 'FR' ? 'Champvert - Guide naturaliste mobile' : 'Champvert - Mobile field guide';
    document.getElementById('pageTitle').textContent = strings.pageTitle;
    document.getElementById('introTitle').textContent = strings.introTitle;
    document.getElementById('introText').textContent = strings.introText;
    document.getElementById('mapTitle').textContent = strings.mapTitle;
    document.getElementById('mapText').textContent = strings.mapText;
    document.getElementById('mapImage').alt = strings.mapImageAlt;
    document.getElementById('mapMetaLabel').textContent = strings.mapMetaLabel;
    document.getElementById('mapMetaLink').textContent = strings.mapMetaLink;
    document.getElementById('listTitle').textContent = strings.listTitle;
    document.getElementById('listText').textContent = strings.listText;
    document.getElementById('desktopNote').textContent = strings.desktopNote;
    searchInput.placeholder = strings.searchPlaceholder;
    emptyState.textContent = strings.emptyState;
    loadingState.textContent = strings.loading;
    poeticLabel.textContent = strings.poeticLabel;
    scientificLabel.textContent = strings.scientificLabel;
    linksLabel.textContent = strings.linksLabel;
    if (diaToggleBtn) {
      diaToggleBtn.textContent = strings.diaLabel;
      diaToggleBtn.setAttribute('title', strings.diaLabel);
      diaToggleBtn.setAttribute('aria-label', currentLocale === 'FR' ? 'Lancer le diaporama' : 'Start slideshow');
    }
    langFrBtn.classList.toggle('active', currentLocale === 'FR');
    langFrBtn.setAttribute('aria-pressed', String(currentLocale === 'FR'));
    langEnBtn.classList.toggle('active', currentLocale === 'US');
    langEnBtn.setAttribute('aria-pressed', String(currentLocale === 'US'));
  }

  function renderFilters() {
    const strings = getStrings();
    const filters = [
      { id: 'oiseau', label: strings.filterBirds },
      { id: 'mammifère', label: strings.filterMammals },
      { id: 'all', label: strings.filterAll }
    ];
    filterChips.innerHTML = '';
    filters.forEach((filter) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = filter.label;
      button.classList.toggle('active', activeFilter === filter.id);
      button.addEventListener('click', () => {
        activeFilter = filter.id;
        renderFilters();
        renderSpeciesList();
      });
      filterChips.appendChild(button);
    });
  }

  function getFilteredEntries() {
    const query = searchInput.value.trim().toLowerCase();
    return speciesEntries.filter((entry) => {
      const categoryMatch = activeFilter === 'all' || entry.category === activeFilter;
      if (!categoryMatch) return false;
      if (!query) return true;
      return `${entry.title} ${entry.scientific}`.toLowerCase().includes(query);
    });
  }

  function scrollViewerIntoView() {
    if (viewer.classList.contains('hidden')) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    viewer.scrollIntoView({
      behavior: prefersReducedMotion ? 'auto' : 'smooth',
      block: 'start'
    });
  }

  function selectEntry(id) {
    selectedId = id;
    activeVariantIndex = 0;
    renderSpeciesList();
    renderViewer();
    requestAnimationFrame(scrollViewerIntoView);
  }

  function renderSpeciesList() {
    const strings = getStrings();
    const entries = getFilteredEntries();
    speciesList.innerHTML = '';
    emptyState.hidden = entries.length > 0;
    loadingState.hidden = true;

    entries.forEach((entry) => {
      const card = document.createElement('article');
      card.className = 'species-card';
      if (entry.id === selectedId) {
        card.classList.add('active');
      }

      const thumb = document.createElement('div');
      thumb.className = 'species-thumb';
      const thumbImg = document.createElement('img');
      thumbImg.src = entry.thumb || 'openStreetViewcarte.jpg';
      thumbImg.alt = entry.title;
      thumb.appendChild(thumbImg);
      thumb.addEventListener('click', () => selectEntry(entry.id));

      const text = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = entry.title;
      const meta = document.createElement('p');
      meta.textContent = entry.scientific || entry.category;
      text.appendChild(title);
      text.appendChild(meta);

      const action = document.createElement('button');
      action.type = 'button';
      action.textContent = strings.viewAction;
      action.addEventListener('click', () => selectEntry(entry.id));

      const actions = document.createElement('div');
      actions.className = 'species-actions';
      if (entry.soundSrc) {
        const soundBtn = document.createElement('button');
        soundBtn.type = 'button';
        soundBtn.className = 'card-sound-btn';
        soundBtn.dataset.entryId = entry.id;
        soundBtn.innerHTML = SPEAKER_ICON;
        soundBtn.addEventListener('click', () => toggleSpeciesSound(entry));
        actions.appendChild(soundBtn);
      }
      actions.appendChild(action);

      card.appendChild(thumb);
      card.appendChild(text);
      card.appendChild(actions);
      speciesList.appendChild(card);
    });

    if (!selectedId && entries.length > 0) {
      selectedId = entries[0].id;
      activeVariantIndex = 0;
      renderSpeciesList();
      return;
    }

    if (selectedId && !entries.some((entry) => entry.id === selectedId)) {
      selectedId = entries[0] ? entries[0].id : null;
      activeVariantIndex = 0;
    }

    renderViewer();
  }

  function renderViewer() {
    const strings = getStrings();
    const entry = speciesEntries.find((item) => item.id === selectedId);
    if (!entry) {
      viewer.classList.add('hidden');
      return;
    }

    const variant = entry.variants[activeVariantIndex] || entry.variants[0];
    const dateText = formatDate(variant.date);
    viewer.classList.remove('hidden');
    viewerTitle.textContent = entry.scientific ? `${entry.title} - ${entry.scientific}` : entry.title;
    viewerMeta.textContent = strings.detailMeta(dateText);
    poeticText.textContent = variant.poeticText || strings.noPoetic;
    scientificText.textContent = variant.scientificText || strings.noScientific;

    viewerVideo.pause();
    viewerVideo.hidden = true;
    viewerImage.hidden = true;

    if (variant.webm) {
      if (viewerVideo.src !== new URL(variant.webm, document.baseURI).href) {
        viewerVideo.src = variant.webm;
      }
      viewerImage.removeAttribute('src');
      viewerImage.alt = '';
      viewerVideo.hidden = false;
      viewerVideo.play().catch(() => {});
    } else {
      viewerVideo.removeAttribute('src');
      viewerVideo.load();
      viewerImage.src = variant.jpeg || entry.thumb || '';
      viewerImage.alt = entry.title;
      viewerImage.hidden = false;
    }

    const total = entry.variants.length;
    variantCount.textContent = strings.mediaCount(activeVariantIndex + 1, total);
    prevVariantBtn.disabled = activeVariantIndex <= 0;
    nextVariantBtn.disabled = activeVariantIndex >= total - 1;

    linksList.innerHTML = '';
    const mapLink = getMapLink(variant.latitude, variant.longitude);

    if (speciesAudioEntryId !== entry.id) {
      stopSpeciesSound();
      speciesAudioEntryId = null;
    }
    speciesSoundBtn.hidden = !entry.soundSrc;
    updateSpeciesSoundButton();
    soundSource.innerHTML = '';
    soundSource.hidden = true;
    if (entry.soundSrc) {
      let sourceNode = null;
      if (entry.soundExternal && entry.soundDetails) {
        sourceNode = document.createElement('a');
        sourceNode.href = entry.soundDetails;
        sourceNode.target = '_blank';
        sourceNode.rel = 'noopener noreferrer';
        sourceNode.textContent = entry.soundDetails;
      } else if (!entry.soundExternal) {
        sourceNode = document.createTextNode(strings.soundOwnSource);
      }
      if (sourceNode) {
        soundSource.append(`${strings.soundSourceLabel} `, sourceNode);
        soundSource.hidden = false;
      }
    }

    // La ligne "image" est toujours présente ; le lien carte n'apparaît que si des coordonnées existent
    linksBlock.hidden = false;
    const imageItem = document.createElement('li');
    imageItem.append(strings.imageLabel);
    if (mapLink) {
      imageItem.append(' : ', createExternalLink(mapLink, strings.openMapLabel));
    }
    linksList.appendChild(imageItem);
    entry.links.forEach((link) => {
      const li = document.createElement('li');
      li.append(`${strings.soundSamplesLabel} : `, createExternalLink(link.href, link.label));
      linksList.appendChild(li);
    });
  }

  function createExternalLink(href, label) {
    const a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = label;
    return a;
  }

  function toggleSpeciesSound(entry) {
    if (!entry || !entry.soundSrc) return;
    if (!speciesAudio.paused && speciesAudioEntryId === entry.id) {
      stopSpeciesSound();
      speciesAudioEntryId = null;
      updateSpeciesSoundButton();
      return;
    }
    speciesAudioEntryId = entry.id;
    speciesAudio.src = entry.soundSrc;
    speciesAudio.play().catch((error) => console.warn('Impossible de démarrer le son de l\'espèce :', error));
    updateSpeciesSoundButton();
  }

  speciesSoundBtn.addEventListener('click', () => {
    toggleSpeciesSound(speciesEntries.find((item) => item.id === selectedId));
  });
  ['play', 'pause', 'ended'].forEach((name) => speciesAudio.addEventListener(name, updateSpeciesSoundButton));

  async function loadEntries() {
    const response = await fetch(DATA_PATH);
    if (!response.ok) {
      throw new Error(`Data loading failed: ${response.status}`);
    }
    const payload = await response.json();
    const images = Array.isArray(payload.images) ? payload.images : [];
    speciesEntries = normalizeEntries(images);
    speciesEntries.sort((a, b) => a.title.localeCompare(b.title, currentLocale === 'FR' ? 'fr' : 'en'));
  }

  function getSavedAudioVolume() {
    const saved = localStorage.getItem(AUDIO_VOLUME_KEY);
    const parsed = parseFloat(saved);
    return Number.isFinite(parsed) && parsed >= 0 && parsed <= 1 ? parsed : 0.55;
  }

  function saveAudioVolume(value) {
    localStorage.setItem(AUDIO_VOLUME_KEY, String(value));
  }

  function setBackgroundAudioVolume(value) {
    const normalized = Math.min(1, Math.max(0, Number(value)));
    if (backgroundAudio) {
      backgroundAudio.volume = normalized;
    }
    if (audioVolumeRange) {
      audioVolumeRange.value = String(normalized);
    }
    saveAudioVolume(normalized);
  }

  function setBackgroundAudioEnabled(shouldEnable) {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const isActive = !!shouldEnable;
    audioToggleBtn.classList.toggle('active', isActive);
    audioToggleBtn.setAttribute('aria-pressed', String(isActive));
    audioToggleBtn.setAttribute('aria-label', isActive ? 'Désactiver le son de fond' : 'Activer le son de fond');
    audioVolumeControl.classList.toggle('hidden', !isActive);
    audioVolumeControl.setAttribute('aria-hidden', String(!isActive));

    if (isActive) {
      backgroundAudio.volume = Number(audioVolumeRange.value) || getSavedAudioVolume();
      backgroundAudio.play().catch((error) => {
        console.warn('Impossible de démarrer le son de fond :', error);
      });
      syncDiaporamaSpeciesSound();
    } else {
      backgroundAudio.pause();
      syncDiaporamaSpeciesSound();
    }
  }

  function toggleBackgroundAudio() {
    if (!audioToggleBtn) return;
    setBackgroundAudioEnabled(!audioToggleBtn.classList.contains('active'));
  }

  function initializeBackgroundAudioControls() {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const startingVolume = getSavedAudioVolume();
    audioVolumeRange.value = String(startingVolume);
    backgroundAudio.volume = startingVolume;
    audioToggleBtn.classList.remove('active');
    audioToggleBtn.setAttribute('aria-pressed', 'false');
    audioToggleBtn.setAttribute('aria-label', 'Activer le son de fond');
    audioVolumeControl.classList.add('hidden');
    audioVolumeControl.setAttribute('aria-hidden', 'true');

    audioToggleBtn.addEventListener('click', (event) => {
      event.preventDefault();
      toggleBackgroundAudio();
    });

    audioVolumeRange.addEventListener('input', (event) => {
      setBackgroundAudioVolume(event.target.value);
    });
  }

  async function loadBackgroundList() {
    try {
      const response = await fetch(BACKGROUND_MANIFEST_PATH);
      if (!response.ok) {
        throw new Error(`Échec du chargement du manifeste des fonds : ${response.status}`);
      }
      const rawData = await response.json();
      const manifestEntries = Array.isArray(rawData.backgrounds) ? rawData.backgrounds : [];
      backgroundEntries = manifestEntries
        .map((entry, index) => {
          if (!entry || typeof entry.src !== 'string' || !entry.src.trim()) return null;
          return {
            id: typeof entry.id === 'string' && entry.id.trim() ? entry.id.trim() : `background-${index + 1}`,
            src: `${entry.src.trim()}`
          };
        })
        .filter(Boolean);
    } catch (error) {
      backgroundEntries = [];
      console.error('Impossible de charger ou traiter background/backgroundList.json :', error);
    }
  }

  function buildDiaporamaEntries() {
    const entries = backgroundEntries.slice();
    speciesEntries.forEach((entry) => {
      entry.variants.forEach((variant, variantIndex) => {
        if (variant.webm) {
          entries.push({
            id: `${entry.id}-${variantIndex}`,
            src: variant.webm,
            soundSrc: entry.soundSrc,
            soundEntryId: entry.id
          });
        }
      });
    });
    return entries;
  }

  function shuffleIndices(length) {
    const indices = Array.from({ length }, (_, index) => index);
    for (let index = indices.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [indices[index], indices[swapIndex]] = [indices[swapIndex], indices[index]];
    }
    return indices;
  }

  function getDiaporamaCycleKey(entries) {
    return entries.map((entry) => entry.id).join('|');
  }

  function resetDiaporamaCycle() {
    diaporamaCycleOrder = [];
    diaporamaCycleCursor = 0;
    diaporamaCycleKey = '';
  }

  function ensureDiaporamaCycle(entries) {
    if (!entries.length) {
      resetDiaporamaCycle();
      return;
    }

    const nextCycleKey = getDiaporamaCycleKey(entries);
    if (diaporamaCycleKey !== nextCycleKey) {
      diaporamaCycleOrder = [];
      diaporamaCycleCursor = 0;
      diaporamaCycleKey = nextCycleKey;
    }

    if (diaporamaCycleCursor < diaporamaCycleOrder.length) {
      return;
    }

    diaporamaCycleOrder = shuffleIndices(entries.length);
    diaporamaCycleCursor = 0;

    if (entries.length > 1 && diaporamaCycleOrder[0] === activeDiaporamaEntryIndex) {
      const swapIndex = diaporamaCycleOrder.findIndex((entryIndex) => entryIndex !== activeDiaporamaEntryIndex);
      if (swapIndex > 0) {
        [diaporamaCycleOrder[0], diaporamaCycleOrder[swapIndex]] = [diaporamaCycleOrder[swapIndex], diaporamaCycleOrder[0]];
      }
    }
  }

  function pickNextDiaporamaEntryIndex() {
    if (!diaporamaEntries.length) return -1;
    if (diaporamaEntries.length === 1) return 0;

    ensureDiaporamaCycle(diaporamaEntries);
    const nextIndex = diaporamaCycleOrder[diaporamaCycleCursor];
    diaporamaCycleCursor += 1;
    return typeof nextIndex === 'number' ? nextIndex : -1;
  }

  function getInactiveDiaporamaVideo() {
    if (diaporamaVideos.length < 2) return diaporamaVideos[0] || null;
    return diaporamaVideos[1 - activeDiaporamaVideoIndex];
  }

  function waitForDiaporamaVideoReady(videoEl) {
    return new Promise((resolve, reject) => {
      let settled = false;

      const cleanup = () => {
        videoEl.removeEventListener('loadeddata', handleReady);
        videoEl.removeEventListener('canplay', handleReady);
        videoEl.removeEventListener('error', handleError);
      };

      const handleReady = () => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve();
      };

      const handleError = () => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error(`Impossible de lire le fond du diaporama : ${videoEl.currentSrc || videoEl.src || 'source inconnue'}`));
      };

      if (videoEl.readyState >= 2) {
        resolve();
        return;
      }

      videoEl.addEventListener('loadeddata', handleReady, { once: true });
      videoEl.addEventListener('canplay', handleReady, { once: true });
      videoEl.addEventListener('error', handleError, { once: true });
    });
  }

  async function prepareDiaporamaVideo(videoEl, entry) {
    if (!videoEl || !entry) return;
    if (videoEl.dataset.diaporamaId === entry.id && videoEl.getAttribute('src') === entry.src) {
      return;
    }

    videoEl.pause();
    videoEl.dataset.diaporamaId = entry.id;
    videoEl.setAttribute('src', entry.src);
    videoEl.load();
    await waitForDiaporamaVideoReady(videoEl);
  }

  async function activateDiaporamaEntry(entryIndex, { immediate = false } = {}) {
    if (entryIndex < 0 || entryIndex >= diaporamaEntries.length || !diaporamaVideos.length) return;

    const transitionToken = ++diaporamaTransitionToken;
    const nextVideo = immediate ? (diaporamaVideos[activeDiaporamaVideoIndex] || diaporamaVideos[0]) : getInactiveDiaporamaVideo();
    const currentVideo = diaporamaVideos[activeDiaporamaVideoIndex] || null;
    const entry = diaporamaEntries[entryIndex];

    if (!nextVideo || !entry) return;

    try {
      await prepareDiaporamaVideo(nextVideo, entry);
      if (transitionToken !== diaporamaTransitionToken) return;

      nextVideo.currentTime = 0;
      nextVideo.play().catch(() => {});
      nextVideo.classList.add('is-active');
      if (currentVideo && currentVideo !== nextVideo) {
        currentVideo.classList.remove('is-active');
        currentVideo.pause();
      }

      activeDiaporamaVideoIndex = diaporamaVideos.indexOf(nextVideo);
      if (activeDiaporamaVideoIndex < 0) {
        activeDiaporamaVideoIndex = 0;
      }
      activeDiaporamaEntryIndex = entryIndex;
      syncDiaporamaSpeciesSound();
    } catch (error) {
      console.error('Impossible d\'activer le fond du diaporama :', error);
    }
  }

  function clearDiaporamaSwitchTimer() {
    if (!diaporamaSwitchTimerId) return;
    window.clearTimeout(diaporamaSwitchTimerId);
    diaporamaSwitchTimerId = null;
  }

  function scheduleDiaporamaSwitch() {
    clearDiaporamaSwitchTimer();
    if (!diaporamaActive) return;

    diaporamaSwitchTimerId = window.setTimeout(() => {
      rotateDiaporama().catch((error) => {
        console.error('Impossible de faire tourner le diaporama :', error);
        scheduleDiaporamaSwitch();
      });
    }, DIAPORAMA_CYCLE_MS);
  }

  async function rotateDiaporama() {
    if (!diaporamaActive) return;
    const nextEntryIndex = pickNextDiaporamaEntryIndex();
    if (nextEntryIndex < 0) return;
    await activateDiaporamaEntry(nextEntryIndex);
    scheduleDiaporamaSwitch();
  }

  async function startDiaporamaPlayback() {
    if (!diaporamaEntries.length || !diaporamaVideos.length) return;
    activeDiaporamaEntryIndex = -1;
    const initialEntryIndex = pickNextDiaporamaEntryIndex();
    await activateDiaporamaEntry(initialEntryIndex, { immediate: true });
    scheduleDiaporamaSwitch();
  }

  function stopDiaporamaPlayback() {
    clearDiaporamaSwitchTimer();
    diaporamaVideos.forEach((videoEl) => {
      try {
        videoEl.pause();
        videoEl.classList.remove('is-active');
        videoEl.removeAttribute('src');
        videoEl.load();
        delete videoEl.dataset.diaporamaId;
      } catch (error) {}
    });
    resetDiaporamaCycle();
    activeDiaporamaEntryIndex = -1;
  }

  function handleDiaporamaExit(event) {
    event.preventDefault();
    event.stopPropagation();
    exitDiaporamaMode();
  }

  function enterDiaporamaMode() {
    if (diaporamaActive) return;
    diaporamaEntries = buildDiaporamaEntries();
    if (!diaporamaEntries.length) return;

    diaporamaActive = true;
    body.classList.add('diaporama-active');
    startDiaporamaPlayback().catch((error) => {
      console.error('Impossible de démarrer le diaporama :', error);
    });

    document.addEventListener('keydown', handleDiaporamaExit, true);
    document.addEventListener('click', handleDiaporamaExit, true);
  }

  function exitDiaporamaMode() {
    if (!diaporamaActive) return;
    diaporamaActive = false;
    document.removeEventListener('keydown', handleDiaporamaExit, true);
    document.removeEventListener('click', handleDiaporamaExit, true);

    body.classList.remove('diaporama-active');
    stopDiaporamaPlayback();
  }

  async function initialize() {
    setPreferredView('mobile');
    applyStaticStrings();
    renderFilters();
    initializeBackgroundAudioControls();
    loadBackgroundList();

    try {
      await loadEntries();
      renderSpeciesList();
    } catch (error) {
      loadingState.hidden = true;
      emptyState.hidden = false;
      emptyState.textContent = currentLocale === 'FR'
        ? 'Impossible de charger les espèces pour le moment.'
        : 'Unable to load species at the moment.';
      console.error(error);
    }
  }

  langFrBtn.addEventListener('click', () => {
    currentLocale = 'FR';
    applyStaticStrings();
    renderFilters();
    const savedSelectedId = selectedId;
    initializeFromCurrentData(savedSelectedId);
  });

  langEnBtn.addEventListener('click', () => {
    currentLocale = 'US';
    applyStaticStrings();
    renderFilters();
    const savedSelectedId = selectedId;
    initializeFromCurrentData(savedSelectedId);
  });

  function initializeFromCurrentData(savedSelectedId = null) {
    loadEntries()
      .then(() => {
        selectedId = savedSelectedId && speciesEntries.some((entry) => entry.id === savedSelectedId)
          ? savedSelectedId
          : null;
        renderSpeciesList();
      })
      .catch((error) => console.error(error));
  }

  searchInput.addEventListener('input', () => {
    renderSpeciesList();
  });

  prevVariantBtn.addEventListener('click', () => {
    const entry = speciesEntries.find((item) => item.id === selectedId);
    if (!entry) return;
    activeVariantIndex = Math.max(0, activeVariantIndex - 1);
    renderViewer();
  });

  nextVariantBtn.addEventListener('click', () => {
    const entry = speciesEntries.find((item) => item.id === selectedId);
    if (!entry) return;
    activeVariantIndex = Math.min(entry.variants.length - 1, activeVariantIndex + 1);
    renderViewer();
  });

  if (diaToggleBtn) {
    diaToggleBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      enterDiaporamaMode();
    });
  }

  initialize();
</script></template>

<script src="https://cdn.jsdelivr.net/gh/cnumr/ecoindex_badge@3/assets/js/ecoindex-badge.js" defer></script>
</body>
</html>
