<title>Nature en ville – Balade interactive à Champvert (Lyon 5)</title>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const requestedView = params.get('view');
    const prefKey = 'siteBaladeChampvertPreferredView';

    if (requestedView === 'desktop') {
      try {
        localStorage.setItem(prefKey, 'desktop');
      } catch (error) {}
      return;
    }

    if (requestedView === 'mobile') {
      try {
        localStorage.setItem(prefKey, 'mobile');
      } catch (error) {}
      window.location.replace('mobile.html?view=mobile');
      return;
    }

    const isSmallScreen = window.matchMedia('(max-width: 900px)').matches;
    const ua = navigator.userAgent || '';
    const isMobileAgent = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);

    if (isSmallScreen || isMobileAgent) {
      window.location.replace('mobile.html?view=mobile');
      return;
    }

    let storedPreference = '';
    try {
      storedPreference = localStorage.getItem(prefKey) || '';
    } catch (error) {}

    if (storedPreference === 'mobile') {
      window.location.replace('mobile.html?view=mobile');
    }
  })();
</script>

  function computePolygonCentroid(points) {
    let twiceArea = 0;
    let centroidX = 0;
    let centroidY = 0;

    for (let index = 0; index < points.length; index += 1) {
      const [x1, y1] = points[index];
      const [x2, y2] = points[(index + 1) % points.length];
      const cross = (x1 * y2) - (x2 * y1);

      twiceArea += cross;
      centroidX += (x1 + x2) * cross;
      centroidY += (y1 + y2) * cross;
    }

    if (Math.abs(twiceArea) < 0.0001) {
      const fallback = points.reduce((sum, [x, y]) => ({ x: sum.x + x, y: sum.y + y }), { x: 0, y: 0 });
      return { x: fallback.x / points.length, y: fallback.y / points.length };
    }

    return {
      x: centroidX / (3 * twiceArea),
      y: centroidY / (3 * twiceArea)
    };
  }

    const minY = rect.height - (rect.height * scale);

    return {

      x: Math.min(0, Math.max(minX, nextState.x)),

  function isPointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i][0];
      const yi = points[i][1];
      const xj = points[j][0];
      const yj = points[j][1];
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 0.0000001) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getRandomPointInPolygon(polygon, attempts = 300) {
    const xs = polygon.map((p) => p[0]);
    const ys = polygon.map((p) => p[1]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    for (let i = 0; i < attempts; i += 1) {
      const x = minX + Math.random() * (maxX - minX);
      const y = minY + Math.random() * (maxY - minY);
      if (isPointInPolygon(x, y, polygon)) {
        return { x, y };
      }
    }
    return { x: zoneCentroid.x, y: zoneCentroid.y };
  }

  function findNonOverlappingPoint(existingPoints, radius = 50, attempts = 300) {
    for (let tryIndex = 0; tryIndex < attempts; tryIndex += 1) {
      const candidate = getRandomPointInPolygon(zonePolygonPoints, 30);
      const tooClose = existingPoints.some((point) => {
        const dx = point.x - candidate.x;
        const dy = point.y - candidate.y;
        return Math.hypot(dx, dy) < radius * 2;
      });
      if (!tooClose) {
        return candidate;
      }
    }
    return null;
  }

  function getPoiAnchorElement(pointEl) {
    if (!pointEl) return null;

  function getPoiMotionState(pointEl) {

  function setPoiMotionPosition(pointEl, nextX, nextY) {
    const motionState = getPoiMotionState(pointEl);
    if (!motionState) return;

    motionState.currentX = nextX;

    pointEl.setAttribute('transform', `translate(${(nextX - motionState.baseX).toFixed(3)} ${(nextY - motionState.baseY).toFixed(3)})`);
  }

  function getPoiMotionBaseDistance() {
    const viewportRect = mapViewport.getBoundingClientRect();
    return Math.min(viewportRect.width, viewportRect.height) / 10 / Math.max(mapState.scale, 0.001);
  }

  function isPoiMotionOutsideSoftBounds(candidateX, candidateY) {
    const margin = getPoiMotionBaseDistance() * 1.2;
    return candidateX < zoneBounds.minX - margin
      || candidateX > zoneBounds.maxX + margin
      || candidateY < zoneBounds.minY - margin
      || candidateY > zoneBounds.maxY + margin;
  }

  function clampPoiMotionDistance(originX, originY, candidateX, candidateY, maxDistance) {
    const deltaX = candidateX - originX;
    const deltaY = candidateY - originY;
    const distance = Math.hypot(deltaX, deltaY);
    if (!distance || distance <= maxDistance) {
      return { x: candidateX, y: candidateY };
    }

    const ratio = maxDistance / distance;
    return {
      x: originX + (deltaX * ratio),
      y: originY + (deltaY * ratio)
    };
  }

  function getPoiMotionControlPoint(startX, startY, endX, endY) {
    const deltaX = endX - startX;
    const deltaY = endY - startY;
    const distance = Math.hypot(deltaX, deltaY);
    if (!distance || Math.random() < 0.45) {
      return null;
    }

    const midX = startX + (deltaX * 0.5);
    const midY = startY + (deltaY * 0.5);
    const normalX = -deltaY / distance;
    const normalY = deltaX / distance;
    const curveStrength = distance * randomBetween(0.12, 0.3) * (Math.random() < 0.5 ? -1 : 1);

    return {
      x: midX + (normalX * curveStrength),
      y: midY + (normalY * curveStrength)
    };
  }

  function getPoiMotionDestination(pointEl) {
    const motionState = getPoiMotionState(pointEl);
    if (!motionState) return null;

    const startX = motionState.currentX;
    const startY = motionState.currentY;
    const maxDistance = getPoiMotionBaseDistance();
    const currentlyInside = isPointInPolygon(startX, startY, zonePolygonPoints);
    const preferInside = !currentlyInside || Math.random() < 0.84;

    for (let attempt = 0; attempt < 28; attempt += 1) {
      const angle = Math.random() * Math.PI * 2;
      const distance = maxDistance * randomBetween(0.35, 1);
      let candidateX = startX + (Math.cos(angle) * distance);
      let candidateY = startY + (Math.sin(angle) * distance);

      if (!preferInside && currentlyInside) {
        const awayX = startX - zoneCentroid.x;
        const awayY = startY - zoneCentroid.y;
        const awayLength = Math.hypot(awayX, awayY) || 1;
        const tangent = randomBetween(-0.22, 0.22) * maxDistance;
        candidateX = startX + ((awayX / awayLength) * distance) - ((awayY / awayLength) * tangent);
        candidateY = startY + ((awayY / awayLength) * distance) + ((awayX / awayLength) * tangent);
      }

      const inside = isPointInPolygon(candidateX, candidateY, zonePolygonPoints);
      if (preferInside && inside) {
        return clampPoiMotionDistance(startX, startY, candidateX, candidateY, maxDistance);
      }
      if (!preferInside && !inside && !isPoiMotionOutsideSoftBounds(candidateX, candidateY)) {
        return clampPoiMotionDistance(startX, startY, candidateX, candidateY, maxDistance);
      }
    }

    const fallbackInside = getRandomPointInPolygon(zonePolygonPoints, 80);
    const blend = currentlyInside ? randomBetween(0.25, 0.45) : randomBetween(0.45, 0.68);
    const candidateX = startX + ((fallbackInside.x - startX) * blend);
    const candidateY = startY + ((fallbackInside.y - startY) * blend);
    return clampPoiMotionDistance(startX, startY, candidateX, candidateY, maxDistance);
  }

  function getPoiMotionPosition(move, progress) {
    if (!move.control) {
      return {
        x: move.startX + ((move.endX - move.startX) * progress),
        y: move.startY + ((move.endY - move.startY) * progress)
      };
    }

    const oneMinus = 1 - progress;
    return {
      x: (oneMinus * oneMinus * move.startX) + (2 * oneMinus * progress * move.control.x) + (progress * progress * move.endX),
      y: (oneMinus * oneMinus * move.startY) + (2 * oneMinus * progress * move.control.y) + (progress * progress * move.endY)
    };
  }

  function getPoiMotionMaxConcurrent() {
    return window.innerWidth <= 700 ? 2 : 3;
  }

  function getPoiMotionTickDelay() {
    return window.innerWidth <= 700 ? randomBetween(2600, 4200) : randomBetween(1700, 3200);
  }

  function canRunPoiMotion() {
    return !poiMotionPaused && !isOpen && points.length > 0 && body.classList.contains('intro-complete');
  }

  function clearPoiMotionScheduler() {
    if (!poiMotionSchedulerId) return;
    window.clearTimeout(poiMotionSchedulerId);
    poiMotionSchedulerId = null;
  }

  function stopPoiMotionEngine() {
    clearPoiMotionScheduler();
    if (poiMotionRafId) {
      window.cancelAnimationFrame(poiMotionRafId);
      poiMotionRafId = null;
    }
  }

  function ensurePoiMotionFrame() {
    if (poiMotionPaused || poiMotionRafId) return;
    poiMotionRafId = window.requestAnimationFrame(stepPoiMotionFrame);
  }

  function schedulePoiMotionTick(delay = getPoiMotionTickDelay()) {
    clearPoiMotionScheduler();
    if (!canRunPoiMotion()) return;

    poiMotionSchedulerId = window.setTimeout(() => {
      poiMotionSchedulerId = null;
      launchPoiMotionIfNeeded();
      schedulePoiMotionTick();
    }, delay);
  }

  function startPoiMotion(pointEl, now = performance.now()) {
    const motionState = getPoiMotionState(pointEl);
    if (!motionState || motionState.moving) return false;

    const destination = getPoiMotionDestination(pointEl);
    if (!destination) return false;

    const distance = Math.hypot(destination.x - motionState.currentX, destination.y - motionState.currentY);
    if (distance < 1) {
      motionState.restUntil = now + poiMotionRestMs;
      return false;
    }

    const baseDistance = getPoiMotionBaseDistance();
    const duration = Math.max(2200, Math.min(11200, (distance / Math.max(baseDistance, 1)) * poiMotionBaseTravelMs));
    motionState.moving = true;
    motionState.move = {
      startX: motionState.currentX,
      startY: motionState.currentY,
      endX: destination.x,
      endY: destination.y,
      control: getPoiMotionControlPoint(motionState.currentX, motionState.currentY, destination.x, destination.y),
      startedAt: now,
      duration
    };
    pointEl.classList.add('is-moving');
    ensurePoiMotionFrame();
    return true;
  }

  function stepPoiMotionFrame(now) {
    poiMotionRafId = null;
    let hasActiveMotion = false;

    points.forEach((point) => {
      const motionState = getPoiMotionState(point);
      if (!motionState || !motionState.moving || !motionState.move) return;

      hasActiveMotion = true;
      const rawProgress = Math.min(1, (now - motionState.move.startedAt) / motionState.move.duration);
      const easedProgress = easeInOutCubic(rawProgress);
      const nextPosition = getPoiMotionPosition(motionState.move, easedProgress);
      setPoiMotionPosition(point, nextPosition.x, nextPosition.y);

      if (rawProgress >= 1) {
        motionState.moving = false;
        motionState.move = null;
        motionState.restUntil = now + poiMotionRestMs + randomBetween(0, 2800);
        point.classList.remove('is-moving');
      }
    });

    if (hasActiveMotion && !poiMotionPaused) {
      ensurePoiMotionFrame();
    }
  }

  function launchPoiMotionIfNeeded() {
    if (!canRunPoiMotion()) return;

    const now = performance.now();
    const movingCount = points.reduce((count, point) => {
      const motionState = getPoiMotionState(point);
      return count + (motionState?.moving ? 1 : 0);
    }, 0);
    const capacity = getPoiMotionMaxConcurrent() - movingCount;
    if (capacity <= 0) return;

    const eligible = points.filter((point) => {
      const motionState = getPoiMotionState(point);
      return motionState && !motionState.moving && motionState.restUntil <= now;
    });
    if (eligible.length === 0) return;

    const shouldLaunch = Math.random() < (movingCount > 0 ? 0.46 : 0.34);
    if (!shouldLaunch) return;

    const maxLaunches = Math.min(capacity, eligible.length, movingCount > 0 ? 2 : 1);
    const launchCount = maxLaunches > 1 && Math.random() < 0.24 ? 2 : 1;

    for (let launched = 0; launched < Math.min(maxLaunches, launchCount); launched += 1) {
      const candidateIndex = Math.floor(Math.random() * eligible.length);
      const [candidate] = eligible.splice(candidateIndex, 1);
      if (candidate) {
        startPoiMotion(candidate, now + launched * 120);
      }
    }
  }

  function pausePoiMotion() {
    if (poiMotionPaused) return;

    poiMotionPaused = true;
    poiMotionPauseStartedAt = performance.now();
    clearPoiMotionScheduler();
    if (poiMotionRafId) {
      window.cancelAnimationFrame(poiMotionRafId);
      poiMotionRafId = null;
    }

    points.forEach((point) => {
      const motionState = getPoiMotionState(point);
      if (motionState?.moving && motionState.move) {
        motionState.move.pausedAt = poiMotionPauseStartedAt;
      }
    });
  }

  function resumePoiMotion() {
    if (!poiMotionPaused) {
      syncPoiMotionLifecycle();
      return;
    }

    const now = performance.now();
    const pauseDelta = poiMotionPauseStartedAt ? now - poiMotionPauseStartedAt : 0;
    poiMotionPaused = false;
    poiMotionPauseStartedAt = 0;

    points.forEach((point) => {
      const motionState = getPoiMotionState(point);
      if (motionState?.moving && motionState.move) {
        motionState.move.startedAt += pauseDelta;
        delete motionState.move.pausedAt;
      }
    });

    syncPoiMotionLifecycle();
  }

  function syncPoiMotionLifecycle() {
    if (!canRunPoiMotion()) {
      stopPoiMotionEngine();
      return;
    }

    const hasActiveMotion = points.some((point) => getPoiMotionState(point)?.moving);
    if (hasActiveMotion) {
      ensurePoiMotionFrame();
    }
    schedulePoiMotionTick();
  }

  function createPoiElement(image, index, occupiedPositions) {
    const pointGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const point = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const position = findNonOverlappingPoint(occupiedPositions, 42, 200);
    const cx = position ? position.x : zoneCentroid.x;
    const cy = position ? position.y : zoneCentroid.y;

    pointGroup.setAttribute('class', 'poi-item');
    pointGroup.setAttribute('transform', 'translate(0 0)');

    pulse.setAttribute('class', 'point-pulse');
    pulse.setAttribute('cx', String(cx));
    pulse.setAttribute('cy', String(cy));
    pulse.setAttribute('r', '28');

    point.setAttribute('class', 'point');
    point.setAttribute('cx', String(cx));
    point.setAttribute('cy', String(cy));
    point.setAttribute('r', '11');
    pointGroup.dataset.video = (image.webm && image.webm !== '_') ? `${poiMediaPathPrefix}${image.webm}` : '_';
    pointGroup.dataset.jpeg = (image.jpeg && image.jpeg !== '_') ? `${poiMediaPathPrefix}${image.jpeg}` : '_';
    pointGroup.dataset.title = getPreferredNameWithScientific(image.name, 'Observation');
    pointGroup.dataset.poetic = getPreferredText(image.poeticText, '');
    pointGroup.dataset.scientific = getPreferredText(image.scientificText, '');
    pointGroup.dataset.text = getPreferredText(image.poeticText, getPreferredText(image.scientificText, 'Texte à venir.'));
    pointGroup.dataset.links = JSON.stringify(Array.isArray(image.liensSon) ? image.liensSon.filter((link) => typeof link === 'string' && link && link !== '_') : []);
    pointGroup.dataset.regions = JSON.stringify([]);
    pointVariants.set(pointGroup, normalizeVariants(image));
    pointGroup.appendChild(pulse);
    pointGroup.appendChild(point);
    poiLayer.appendChild(pointGroup);

    pointMotionStates.set(pointGroup, {
      baseX: cx,
      baseY: cy,
      currentX: cx,
      currentY: cy,
      moving: false,
      move: null,
      restUntil: performance.now() + randomBetween(5000, 12000)
    });

    occupiedPositions.push({ x: cx, y: cy });
    return pointGroup;
  }

  async function loadPoiData() {
    try {
      const response = await fetch('data/data.json');
      if (!response.ok) {
        throw new Error(`Échec du chargement du JSON : ${response.status}`);
      }
      const rawData = await response.json();
      rawImages = Array.isArray(rawData.images) ? rawData.images : [];
      refreshPoiLayer();
    } catch (error) {
      console.error('Impossible de charger ou traiter data/data.json :', error);
    } finally {
      poiDataLoaded = true;
      tryAutoStartDiaporama();
    }
  }

  async function loadBackgroundList() {
    try {
      const response = await fetch(backgroundManifestPath);
      if (!response.ok) {
        throw new Error(`Échec du chargement du manifeste des fonds : ${response.status}`);
      }

      const rawData = await response.json();
      const manifestEntries = Array.isArray(rawData.backgrounds) ? rawData.backgrounds : [];
      backgroundEntries = manifestEntries
        .map((entry, index) => {
          if (!entry || typeof entry.src !== 'string' || !entry.src.trim()) return null;
          return {
            id: typeof entry.id === 'string' && entry.id.trim() ? entry.id.trim() : `background-${index + 1}`,
            src: entry.src.trim()
          };
        })
        .filter(Boolean);
      syncBackgroundPlayback();
    } catch (error) {
      backgroundEntries = [];
      console.error('Impossible de charger ou traiter background/backgroundList.json :', error);
    } finally {
      backgroundListLoaded = true;
      tryAutoStartDiaporama();
    }
  }

  function clearBackgroundSwitchTimer() {
    if (!backgroundSwitchTimerId) return;
    window.clearTimeout(backgroundSwitchTimerId);
    backgroundSwitchTimerId = null;
  }

  function shouldShowBackgroundMedia() {
    return body.classList.contains('intro-complete') && !body.classList.contains('show-map');
  }

  function getBackgroundEntries() {
    return diaporamaActive ? diaporamaEntries : backgroundEntries;
  }

  function shouldRunBackgroundPlayback() {
    return shouldShowBackgroundMedia() && !isOpen && getBackgroundEntries().length > 0 && backgroundVideos.length > 0;
  }

  function getInactiveBackgroundVideo() {
    if (backgroundVideos.length < 2) return backgroundVideos[0] || null;
    return backgroundVideos[1 - activeBackgroundVideoIndex];
  }

  function pickNextBackgroundEntryIndex() {
    const entries = getBackgroundEntries();
    if (!entries.length) return -1;
    if (entries.length === 1) return 0;

    let nextIndex = activeBackgroundEntryIndex;
    while (nextIndex === activeBackgroundEntryIndex) {
      nextIndex = Math.floor(Math.random() * entries.length);
    }

    return nextIndex;
  }

  function waitForBackgroundVideoReady(videoEl) {
    return new Promise((resolve, reject) => {
      let settled = false;

      const cleanup = () => {
        videoEl.removeEventListener('loadeddata', handleReady);
        videoEl.removeEventListener('canplay', handleReady);
        videoEl.removeEventListener('error', handleError);
      };

      const handleReady = () => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve();
      };

      const handleError = () => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error(`Impossible de lire le fond vidéo : ${videoEl.currentSrc || videoEl.src || 'source inconnue'}`));
      };

      if (videoEl.readyState >= 2) {
        resolve();
        return;
      }

      videoEl.addEventListener('loadeddata', handleReady, { once: true });
      videoEl.addEventListener('canplay', handleReady, { once: true });
      videoEl.addEventListener('error', handleError, { once: true });
    });
  }

  async function prepareBackgroundVideo(videoEl, entry) {
    if (!videoEl || !entry) return;
    if (videoEl.dataset.backgroundId === entry.id && videoEl.getAttribute('src') === entry.src) {
      return;
    }

    videoEl.pause();
    videoEl.dataset.backgroundId = entry.id;
    videoEl.setAttribute('src', entry.src);
    videoEl.load();
    await waitForBackgroundVideoReady(videoEl);
  }

  async function activateBackgroundEntry(entryIndex, { immediate = false } = {}) {
    const entries = getBackgroundEntries();
    if (entryIndex < 0 || entryIndex >= entries.length || !backgroundVideos.length) return;

    const transitionToken = ++backgroundTransitionToken;
    const nextVideo = immediate ? (backgroundVideos[activeBackgroundVideoIndex] || backgroundVideos[0]) : getInactiveBackgroundVideo();
    const currentVideo = backgroundVideos[activeBackgroundVideoIndex] || null;
    const entry = entries[entryIndex];

    if (!nextVideo || !entry) return;

    try {
      await prepareBackgroundVideo(nextVideo, entry);
      if (transitionToken !== backgroundTransitionToken) return;

      nextVideo.currentTime = 0;
      if (!backgroundPlaybackPaused) {
        nextVideo.play().catch(() => {});
      }

      nextVideo.classList.add('is-active');
      if (currentVideo && currentVideo !== nextVideo) {
        currentVideo.classList.remove('is-active');
        currentVideo.pause();
      }

      activeBackgroundVideoIndex = backgroundVideos.indexOf(nextVideo);
      if (activeBackgroundVideoIndex < 0) {
        activeBackgroundVideoIndex = 0;
      }
      activeBackgroundEntryIndex = entryIndex;
    } catch (error) {
      console.error('Impossible d\'activer le fond vidéo :', error);
    }
  }

  async function rotateBackground() {
    if (!shouldRunBackgroundPlayback()) return;

    const nextEntryIndex = pickNextBackgroundEntryIndex();
    if (nextEntryIndex < 0) return;

    await activateBackgroundEntry(nextEntryIndex);
    scheduleBackgroundSwitch();
  }

  function scheduleBackgroundSwitch() {
    clearBackgroundSwitchTimer();
    if (!shouldRunBackgroundPlayback()) return;

    backgroundSwitchTimerId = window.setTimeout(() => {
      rotateBackground().catch((error) => {
        console.error('Impossible de faire tourner les fonds vidéo :', error);
        scheduleBackgroundSwitch();
      });
    }, backgroundCycleMs);
  }

  async function startBackgroundPlayback() {
    if (!getBackgroundEntries().length || !backgroundVideos.length) return;

    backgroundPlaybackPaused = false;

    if (activeBackgroundEntryIndex < 0) {
      const initialEntryIndex = pickNextBackgroundEntryIndex();
      await activateBackgroundEntry(initialEntryIndex, { immediate: true });
    }

    const activeVideo = backgroundVideos[activeBackgroundVideoIndex];
    activeVideo?.play().catch(() => {});
    scheduleBackgroundSwitch();
  }

  function pauseBackgroundPlayback() {
    backgroundPlaybackPaused = true;
    clearBackgroundSwitchTimer();
    backgroundVideos.forEach((videoEl) => {
      try {
        videoEl.pause();
      } catch (error) {}
    });
  }

  function syncBackgroundPlayback() {
    const showBackgroundMedia = shouldShowBackgroundMedia();
    const hasEntries = getBackgroundEntries().length > 0;
    body.classList.toggle('show-background-media', showBackgroundMedia && hasEntries);

    if (backgroundStage) {
      backgroundStage.setAttribute('aria-hidden', String(!(showBackgroundMedia && hasEntries)));
    }

    if (!showBackgroundMedia || isOpen) {
      pauseBackgroundPlayback();
      return;
    }

    startBackgroundPlayback().catch((error) => {
      console.error('Impossible de démarrer le fond vidéo :', error);
    });
  }

  function buildDiaporamaEntries() {
    const entries = backgroundEntries.slice();
    rawImages.forEach((image, imageIndex) => {
      normalizeVariants(image).forEach((variant, variantIndex) => {
        if (variant.webm && variant.webm !== '_') {
          entries.push({ id: `data-${imageIndex}-${variantIndex}`, src: variant.webm });
        }
      });
    });
    return entries;
  }

  function consumeAutoStartDiaporamaParam() {
    if (!autoStartDiaporamaRequested || !currentUrl.searchParams.has('autostart')) return;
    currentUrl.searchParams.delete('autostart');
    currentUrl.searchParams.delete('view');
    const nextUrl = `${currentUrl.pathname}${currentUrl.searchParams.toString() ? `?${currentUrl.searchParams.toString()}` : ''}${currentUrl.hash}`;
    window.history.replaceState({}, '', nextUrl);
  }

  function tryAutoStartDiaporama() {
    if (!autoStartDiaporamaRequested || autoStartDiaporamaAttempted) return;
    if (!introComplete || !poiDataLoaded || !backgroundListLoaded) return;

    autoStartDiaporamaAttempted = true;
    consumeAutoStartDiaporamaParam();
    enterDiaporamaMode();
    setBackgroundAudioEnabled(true);
  }

  function handleDiaporamaExit(event) {
    event.preventDefault();
    event.stopPropagation();
    exitDiaporamaMode();
  }

  function enterDiaporamaMode() {
    if (diaporamaActive || isOpen) return;

    diaporamaWasMapMode = body.classList.contains('show-map');
    diaporamaEntries = buildDiaporamaEntries();
    if (!diaporamaEntries.length) return;

    diaporamaActive = true;
    body.classList.add('diaporama-active');

    if (diaporamaWasMapMode) {
      activeBackgroundEntryIndex = -1;
      body.classList.remove('show-map');
      syncBackgroundPlayback();
    }

    document.addEventListener('keydown', handleDiaporamaExit, true);
    document.addEventListener('click', handleDiaporamaExit, true);
  }

  function exitDiaporamaMode() {
    if (!diaporamaActive) return;
    diaporamaActive = false;
    document.removeEventListener('keydown', handleDiaporamaExit, true);
    document.removeEventListener('click', handleDiaporamaExit, true);

    body.classList.remove('diaporama-active');

    if (diaporamaWasMapMode) {
      activeBackgroundEntryIndex = -1;
      body.classList.add('dia-map-return');
      body.classList.add('show-map');
      window.setTimeout(() => {
        body.classList.remove('dia-map-return');
      }, 2100);
      syncBackgroundPlayback();
    }
  }

  function applyMapTransform() {
    mapScene.style.transform = `translate(${mapState.x}px, ${mapState.y}px) scale(${mapState.scale})`;
  }

  function setMapState(nextState) {
    mapState = clampMapState(nextState);
    applyMapTransform();
  }

  function zoomAt(clientX, clientY, deltaScale) {
    const rect = getViewportRect();
    const pointerX = clientX - rect.left;
    const pointerY = clientY - rect.top;
    const nextScale = Math.min(maxScale, Math.max(minScale, mapState.scale + deltaScale));

    if (nextScale === mapState.scale) return;

    const sceneX = (pointerX - mapState.x) / mapState.scale;
    const sceneY = (pointerY - mapState.y) / mapState.scale;

    setMapState({
      scale: nextScale,
      x: pointerX - (sceneX * nextScale),
      y: pointerY - (sceneY * nextScale)
    });
  }

  function resetMapView() {
    setMapState({ scale: 1, x: 0, y: 0 });
  }

  function startDrag(pointerId, clientX, clientY) {
    dragState = {
      pointerId,
      startX: clientX,
      startY: clientY,
      originX: mapState.x,
      originY: mapState.y
    };
    mapViewport.classList.add('is-dragging');
  }

  function stopDrag() {
    dragState = null;
    mapViewport.classList.remove('is-dragging');
    window.getSelection()?.removeAllRanges();
  }

  function getPointerDistance(pointerA, pointerB) {
    return Math.hypot(pointerA.clientX - pointerB.clientX, pointerA.clientY - pointerB.clientY);
  }

  function getPointerCenter(pointerA, pointerB) {
    return {
      clientX: (pointerA.clientX + pointerB.clientX) / 2,
      clientY: (pointerA.clientY + pointerB.clientY) / 2
    };
  }

  function startPinch() {
    const pointers = Array.from(activePointers.values());
    if (pointers.length < 2) return;

    const [first, second] = pointers;
    pinchState = {
      startDistance: getPointerDistance(first, second),
      startScale: mapState.scale,
      center: getPointerCenter(first, second),
      originX: mapState.x,
      originY: mapState.y
    };
    stopDrag();
  }

  function updatePinch() {
    if (!pinchState || activePointers.size < 2) return;

    const [first, second] = Array.from(activePointers.values());
    const center = getPointerCenter(first, second);
    const nextScale = pinchState.startScale * (getPointerDistance(first, second) / pinchState.startDistance);
    const rect = getViewportRect();
    const pointerX = pinchState.center.clientX - rect.left;
    const pointerY = pinchState.center.clientY - rect.top;
    const sceneX = (pointerX - pinchState.originX) / pinchState.startScale;
    const sceneY = (pointerY - pinchState.originY) / pinchState.startScale;

    setMapState({
      scale: nextScale,
      x: (center.clientX - rect.left) - (sceneX * nextScale),
      y: (center.clientY - rect.top) - (sceneY * nextScale)
    });
  }

  function getSessionHighlightKey(highlightId) {
    return `${sessionHighlightPrefix}${highlightId}`;
  }

  function hasSessionHighlightRun(highlightId) {
    try {
      return window.sessionStorage.getItem(getSessionHighlightKey(highlightId)) === 'true';
    } catch (error) {
      return false;
    }
  }

  function markSessionHighlightRun(highlightId) {
    try {
      window.sessionStorage.setItem(getSessionHighlightKey(highlightId), 'true');
    } catch (error) {
      return;
    }
  }

  function playTemporaryHighlight(target, highlightId) {
    if (!target || !highlightId || hasSessionHighlightRun(highlightId)) return false;

    target.classList.add('temporary-highlight');
    if (target instanceof SVGElement) {
      target.classList.add('temporary-highlight--svg');
    }

    const handleAnimationEnd = (event) => {
      const expectedAnimationName = target instanceof SVGElement
        ? 'temporary-highlight-point-pulse'
        : 'temporary-highlight-pulse';
      if (event.target !== target || event.animationName !== expectedAnimationName) return;
      target.classList.remove('is-active');
      target.removeEventListener('animationend', handleAnimationEnd);
    };

    target.addEventListener('animationend', handleAnimationEnd);
    target.classList.remove('is-active');
    void target.offsetWidth;
    target.classList.add('is-active');
    markSessionHighlightRun(highlightId);
    return true;
  }

  function clearPoiIdleHighlightTimer() {
    if (!poiIdleHighlightTimerId) return;
    window.clearTimeout(poiIdleHighlightTimerId);
    poiIdleHighlightTimerId = null;
  }

  function attemptIdlePoiHighlight() {
    if (!poiIdleHighlightDue || hasOpenedPoiVideo || hasSessionHighlightRun('poi-idle-intro')) {
      return false;
    }

    const targetPoint = points[0] || null;
    if (!targetPoint) return false;

    const played = playTemporaryHighlight(getPoiAnchorElement(targetPoint), 'poi-idle-intro');
    if (played) {
      poiIdleHighlightDue = false;
    }
    return played;
  }

  function scheduleIdlePoiHighlight() {
    clearPoiIdleHighlightTimer();
    poiIdleHighlightTimerId = window.setTimeout(() => {
      poiIdleHighlightTimerId = null;
      poiIdleHighlightDue = true;
      attemptIdlePoiHighlight();
    }, poiIdleHighlightDelay);
  }

  function triggerInitialVideoHighlights(hasVariantNavigator) {
    if (hasVariantNavigator) {
      if (videoControls && !videoControls.hasAttribute('hidden')) {
        playTemporaryHighlight(videoControls, 'video-variant-navigator-intro');
      }
    }

    playTemporaryHighlight(modeIndicator, 'video-fullscreen-intro');
    playTemporaryHighlight(closeBtn, 'video-close-intro');
  }

  function runIntro() {
    if (introStarted) return;
    introStarted = true;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        body.classList.add('show-map');
      });
    });

    window.setTimeout(() => {
      body.classList.add('reveal-outline');
    }, 2000);

    window.setTimeout(() => {
      body.classList.add('reveal-shape');
    }, 3000);

    window.setTimeout(() => {
      body.classList.add('intro-complete');
      introComplete = true;
      syncMapVisibility();
      syncBackgroundPlayback();
      showMapHintTemporarily(20000);
      playTemporaryHighlight(mapToggle, 'map-toggle-intro');
      playTemporaryHighlight(infoToggleBtn, 'discover-button-intro');
      playTemporaryHighlight(audioToggleBtn, 'audio-button-intro');
      playTemporaryHighlight(diaToggleBtn, 'dia-toggle-intro');
      syncPoiMotionLifecycle();
      tryAutoStartDiaporama();
    }, 4000);
  }

  if (mapHint) {
    mapHint.addEventListener('click', () => {
      hideMapHint();
    });
  }

  function showMap() {
    body.classList.add('show-map');
    syncBackgroundPlayback();
  }

  function hideMap() {
    if (mapPinned) return;
    body.classList.remove('show-map');
    syncBackgroundPlayback();
  }

  function syncMapVisibility() {
    body.classList.toggle('show-map', mapPinned);
    syncBackgroundPlayback();
  }

  mapToggle.addEventListener('mouseenter', showMap);
  mapToggle.addEventListener('mouseleave', hideMap);
  mapToggle.addEventListener('focus', showMap);
  mapToggle.addEventListener('blur', hideMap);
  mapToggle.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    if (event.target === mapPinToggle) return;
    event.preventDefault();
    if (mapPinned) {
      showMap();
      return;
    }
    body.classList.toggle('show-map');
  });
  mapToggle.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
  });
  mapToggle.addEventListener('touchstart', (event) => {
    if (event.target === mapPinToggle) return;
    body.classList.toggle('show-map', mapPinned ? true : !body.classList.contains('show-map'));
  }, { passive: true });
  mapPinToggle.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
  });
  mapPinToggle.addEventListener('click', (event) => {
    event.stopPropagation();
  });
  mapPinToggle.addEventListener('change', () => {
    mapPinned = mapPinToggle.checked;
    syncMapVisibility();
  });

  zoomInBtn.addEventListener('click', () => {
    const rect = getViewportRect();
    zoomAt(rect.left + (rect.width / 2), rect.top + (rect.height / 2), zoomStep);
  });

  zoomOutBtn.addEventListener('click', () => {
    const rect = getViewportRect();
    zoomAt(rect.left + (rect.width / 2), rect.top + (rect.height / 2), -zoomStep);
  });

  resetViewBtn.addEventListener('click', resetMapView);

  if (diaToggleBtn) {
    diaToggleBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      enterDiaporamaMode();
    });
  }

  if (langFrBtn) {
    langFrBtn.addEventListener('click', () => setActiveLocale('FR'));
  }
  if (langEnBtn) {
    langEnBtn.addEventListener('click', () => setActiveLocale('US'));
  }

  mapViewport.addEventListener('wheel', (event) => {
    event.preventDefault();
    const direction = event.deltaY < 0 ? zoomStep : -zoomStep;
    zoomAt(event.clientX, event.clientY, direction);
  }, { passive: false });

  mapViewport.addEventListener('dblclick', (event) => {
    if (event.target.closest('.point')) return;
    zoomAt(event.clientX, event.clientY, zoomStep * 2);
  });

  mapViewport.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    if (event.target.closest('.point') || event.target.closest('.map-toggle') || event.target.closest('.map-control')) {
      return;
    }

    event.preventDefault();

    activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
    mapViewport.setPointerCapture(event.pointerId);

    if (activePointers.size === 2) {
      startPinch();
      return;
    }

    if (activePointers.size === 1) {
      startDrag(event.pointerId, event.clientX, event.clientY);
    }
  });

  mapViewport.addEventListener('pointermove', (event) => {
    if (dragState || activePointers.size >= 2) {
      event.preventDefault();
    }

    if (activePointers.has(event.pointerId)) {
      activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
    }

    if (activePointers.size >= 2) {
      updatePinch();
      return;
    }

    if (!dragState || dragState.pointerId !== event.pointerId) return;

    setMapState({
      scale: mapState.scale,
      x: dragState.originX + (event.clientX - dragState.startX),
      y: dragState.originY + (event.clientY - dragState.startY)
    });
  });

  function releasePointer(event) {
    activePointers.delete(event.pointerId);
    if (mapViewport.hasPointerCapture(event.pointerId)) {
      mapViewport.releasePointerCapture(event.pointerId);
    }

    if (activePointers.size < 2) {
      pinchState = null;
    }

    if (dragState && dragState.pointerId === event.pointerId) {
      stopDrag();
    }

    if (activePointers.size === 1 && !dragState) {
      const [remainingPointerId, remainingPointer] = activePointers.entries().next().value;
      startDrag(remainingPointerId, remainingPointer.clientX, remainingPointer.clientY);
    }
  }

  mapViewport.addEventListener('pointerup', releasePointer);
  mapViewport.addEventListener('pointercancel', releasePointer);
  mapViewport.addEventListener('dragstart', (event) => {
    event.preventDefault();
  });
  mapViewport.addEventListener('selectstart', (event) => {
    event.preventDefault();
  });
  mapViewport.addEventListener('pointerleave', (event) => {
    if (!mapViewport.hasPointerCapture(event.pointerId)) {
      releasePointer(event);
    }
  });

  function pointToRect(pointEl) {
    const targetElement = getPoiAnchorElement(pointEl) || pointEl;
    const r = targetElement.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    return {
      left: r.left,
      top: r.top,
      width: size,
      height: size
    };
  }

  function rectCenter(rect) {
    return {
      x: rect.left + (rect.width / 2),
      y: rect.top + (rect.height / 2)
    };
  }

  function getTargetRect() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const maxW = vw * 0.42;
    const maxH = vh * 0.42;
    const ratio = 16 / 9;

    let width = maxW;
    let height = width / ratio;

    if (height > maxH) {
      height = maxH;
      width = height * ratio;
    }

    const left = Math.max(36, vw * 0.17);
    const top = (vh - height) / 2;

    return { left, top, width, height };
  }

  function getFullscreenRect() {
    return {
      left: 0,
      top: 0,
      width: window.innerWidth,
      height: window.innerHeight
    };
  }

  function updateModeIndicator() {
    if (!modeIndicator) return;
    modeIndicator.textContent = isFullscreenMode ? 'Fenêtre' : 'Plein écran';
    modeIndicator.setAttribute('aria-label', isFullscreenMode ? 'Passer en mode fenêtre' : 'Passer en mode plein écran');
  }

  function setFullscreenMode(enabled) {
    if (!isOpen || isFullscreenMode === enabled) return;
    isFullscreenMode = enabled;

    if (isFullscreenMode) {
      viewer.classList.add('fullscreen');
      hideBubble(true);
      const fullscreenRect = getFullscreenRect();
      setRect(shell, fullscreenRect);
      setRect(halo, getHaloRect(activePointRect, fullscreenRect));
      setBubblePosition(fullscreenRect, activeRegion, true);
    } else {
      viewer.classList.remove('fullscreen');
      fullscreenExitAt = Date.now();
      const target = getTargetRect();
      setRect(shell, target);
      setRect(halo, getHaloRect(activePointRect, target));
      setBubblePosition(target, activeRegion, true);
      window.setTimeout(() => {
        if (isOpen && !isFullscreenMode) showBubble();
      }, 940);
    }
    updateModeIndicator();
  }

  function getHaloRect(fromRect, targetRect) {
    const cx = fromRect.left + fromRect.width / 2;
    const cy = fromRect.top + fromRect.height / 2;
    const radius = Math.max(targetRect.width, targetRect.height) * 1.25;

    return {
      left: cx - radius / 2,
      top: cy - radius / 2,
      width: radius,
      height: radius
    };
  }

  function setRect(el, rect) {
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.width = rect.width + 'px';
    el.style.height = rect.height + 'px';
  }

  function animateZoneElement(drawFrame, duration) {
    return new Promise((resolve) => {
      const start = performance.now();

      function step(now) {
        const progress = Math.min(1, (now - start) / duration);
        drawFrame(progress);
        if (progress < 1) {
          requestAnimationFrame(step);
          return;
        }
        resolve();
      }

      requestAnimationFrame(step);
    });
  }

  function easeInOutCubic(value) {
    if (value < 0.5) {
      return 4 * value * value * value;
    }
    return 1 - (Math.pow(-2 * value + 2, 3) / 2);
  }

  function easeOutQuad(value) {
    return 1 - ((1 - value) * (1 - value));
  }

  function createZoneFlight(rect) {
    const zoneFlight = document.createElement('div');
    const originX = (zoneCentroid.x / 2118) * rect.width;
    const originY = (zoneCentroid.y / 1328) * rect.height;

    zoneFlight.className = 'zone-flight';
    zoneFlight.style.left = `${rect.left}px`;
    zoneFlight.style.top = `${rect.top}px`;
    zoneFlight.style.width = `${rect.width}px`;
    zoneFlight.style.height = `${rect.height}px`;
    zoneFlight.style.transformOrigin = `${originX}px ${originY}px`;
    zoneFlight.style.transform = 'translate(0px, 0px) scale(1)';
    zoneFlight.innerHTML = `
      <svg viewBox="0 0 2118 1328" aria-hidden="true" focusable="false">
        <path fill="#8B5E3C" fill-opacity="0.82" stroke="#5F3F28" stroke-width="2" fill-rule="evenodd" d="${zonePathD}"></path>
      </svg>
    `;

    document.body.appendChild(zoneFlight);

    return {
      zoneFlight,
      originX,
      originY
    };
  }

  async function playPointLaunch(pointEl, pointer = null) {
    const zoneRect = layerSvg.getBoundingClientRect();
    const targetRect = pointToRect(pointEl);
    const targetCenterX = pointer?.clientX ?? (targetRect.left + (targetRect.width / 2));
    const targetCenterY = pointer?.clientY ?? (targetRect.top + (targetRect.height / 2));
    const { zoneFlight, originX, originY } = createZoneFlight(zoneRect);
    const centroidX = zoneRect.left + originX;
    const centroidY = zoneRect.top + originY;
    const finalScale = 0.05;
    let startCenterX = centroidX;
    let startCenterY = centroidY;
    let startTranslateX = 0;
    let startTranslateY = 0;

    if (lastActivatedPoint) {
      const previousPointCenter = rectCenter(pointToRect(lastActivatedPoint));
      startCenterX = previousPointCenter.x;
      startCenterY = previousPointCenter.y;
      startTranslateX = startCenterX - centroidX;
      startTranslateY = startCenterY - centroidY;
      zoneFlight.style.transform = `translate(${startTranslateX}px, ${startTranslateY}px) scale(${finalScale})`;
      zoneFlight.style.opacity = '0.82';
    } else {
      await animateZoneElement((progress) => {
        const eased = easeInOutCubic(progress);
        const scale = 1 + ((finalScale - 1) * eased);
        zoneFlight.style.transform = `translate(0px, 0px) scale(${scale})`;
        zoneFlight.style.opacity = `${0.92 - (0.1 * eased)}`;
      }, 500);
      startTranslateX = 0;
      startTranslateY = 0;
    }

    const deltaX = targetCenterX - startCenterX;
    const deltaY = targetCenterY - startCenterY;
    const lift = Math.max(70, Math.min(220, (Math.abs(deltaX) * 0.18) + 40));
    const controlX = deltaX * 0.5;
    const controlY = (deltaY * 0.5) - lift;

    await animateZoneElement((progress) => {
      const eased = easeOutQuad(progress);
      const inverse = 1 - eased;
      const curveX = (inverse * inverse * 0) + (2 * inverse * eased * controlX) + (eased * eased * deltaX);
      const curveY = (inverse * inverse * 0) + (2 * inverse * eased * controlY) + (eased * eased * deltaY);
      const translateX = startTranslateX + curveX;
      const translateY = startTranslateY + curveY;

      zoneFlight.style.transform = `translate(${translateX}px, ${translateY}px) scale(${finalScale})`;
      zoneFlight.style.opacity = `${0.82 - (0.26 * eased)}`;
    }, 500);

    zoneFlight.remove();
  }

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function pickRegionFromPointer(event, rect, regions) {
    if (!regions || !regions.length) return null;

    const rx = (event.clientX - rect.left) / rect.width;
    const regionIndex = rx < 0.5 ? 0 : 1;
    const region = regions[regionIndex] || regions[0] || null;

    return region ? { ...region, _zoneKey: `zone-${regionIndex}` } : null;
  }

  function setBubblePosition(videoRect, region = null, randomize = false) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const gap = 24;

    if (vw <= 700) {
      infoBubble.style.top = Math.min(vh - 170, videoRect.top + videoRect.height + 18) + 'px';
      infoBubble.style.setProperty('--tail-top', '0px');
      infoBubble.style.setProperty('--tail-rotate', '90deg');
      return;
    }

    const bubbleWidth = Math.min(340, Math.max(240, vw * 0.28));
    const bubbleHeightEstimate = 150;

    let anchorY = videoRect.top + videoRect.height * 0.5;
    if (region) {
      anchorY = videoRect.top + videoRect.height * region.y;
    }

    if (!region) {
      let left = videoRect.left + videoRect.width + gap;
      if (left + bubbleWidth > vw - 24) {
        left = vw - bubbleWidth - 24;
      }
      let top = Math.max(24, Math.min(anchorY - bubbleHeightEstimate * 0.38, vh - bubbleHeightEstimate - 24));
      infoBubble.style.left = left + 'px';
      infoBubble.style.top = top + 'px';
      infoBubble.style.setProperty('--tail-top', '38px');
      infoBubble.style.setProperty('--tail-rotate', '-18deg');
      return;
    }

    if (randomize || !region._bubblePlacement) {
      let left = videoRect.left + videoRect.width + gap + randomBetween(-10, 16);
      if (left + bubbleWidth > vw - 24) {
        left = vw - bubbleWidth - 24;
      }

      let top = anchorY - bubbleHeightEstimate * 0.38 + randomBetween(-12, 12);
      top = Math.max(24, Math.min(top, vh - bubbleHeightEstimate - 24));

      const tailTop = Math.max(18, Math.min(anchorY - top - 10, bubbleHeightEstimate - 22));
      const tailRotate = randomBetween(-26, -8).toFixed(1) + 'deg';

      region._bubblePlacement = { left, top, tailTop, tailRotate };
    }

    const placement = region._bubblePlacement;
    infoBubble.style.left = placement.left + 'px';
    infoBubble.style.top = placement.top + 'px';
    infoBubble.style.setProperty('--tail-top', placement.tailTop + 'px');
    infoBubble.style.setProperty('--tail-rotate', placement.tailRotate);
  }

  function clearBubbleTimer() {
    if (hideBubbleTimer) {
      clearTimeout(hideBubbleTimer);
      hideBubbleTimer = null;
    }
  }

  function hideBubble(immediate = false) {
    clearBubbleTimer();
    bubbleVisible = false;
    infoBubble.classList.remove('visible');
    if (immediate) return;
  }

  function showBubble(event = null) {
    if (!isOpen || !activePointData) return;
    clearBubbleTimer();

    const rect = shell.getBoundingClientRect();
    const region = event ? pickRegionFromPointer(event, rect, activeRegions) : (activeRegion || activeRegions[0]);
    const resolvedRegion = region || activeRegions[0] || {
      label: 'Observation',
      title: activePointData.title,
      text: activePointData.text,
      y: 0.5,
      _zoneKey: 'default-zone'
    };

    const zoneChanged = activeZoneKey !== resolvedRegion._zoneKey;
    const shouldReposition = zoneChanged || !bubbleVisible;

    activeRegion = resolvedRegion;
    activeZoneKey = resolvedRegion._zoneKey;

    infoZoneLabel.textContent = resolvedRegion.label || 'Observation';
    infoTitle.textContent = resolvedRegion.title || activePointData.title;
    const activeInfo = getActiveVariantInfo();
    infoText.innerHTML = resolvedRegion.html || activeInfo.html || activePointData.html || escapeHtml(resolvedRegion.text || activePointData.text);

    if (shouldReposition) {
      setBubblePosition(getTargetRect(), activeRegion, zoneChanged || !activeRegion._bubblePlacement);
    }

    requestAnimationFrame(() => {
      infoBubble.classList.add('visible');
      bubbleVisible = true;
    });
  }

  function scheduleBubbleHide() {
    clearBubbleTimer();
    hideBubbleTimer = setTimeout(() => {
      const hoveredVideo = shell.matches(':hover');
      const hoveredBubble = infoBubble.matches(':hover');
      if (!hoveredVideo && !hoveredBubble) {
        hideBubble();
      }
    }, 140);
  }

  async function openVideo(pointEl, pointer = null) {
    if (openingPoint || isOpen) return;
    openingPoint = true;
    hasOpenedPoiVideo = true;
    poiIdleHighlightDue = false;
    clearPoiIdleHighlightTimer();
    pausePoiMotion();
    pauseBackgroundPlayback();

    try {
      activePointRect = pointToRect(pointEl);
      activePointData = getPointData(pointEl);

      try {
        activeRegions = JSON.parse(pointEl.dataset.regions || '[]');
      } catch (error) {
        console.error('Impossible de lire data-regions :', error, pointEl.dataset.regions);
        activeRegions = [];
      }

      activeRegion = activeRegions[0] ? { ...activeRegions[0], _zoneKey: 'zone-0' } : null;
      activeZoneKey = null;
      pendingInitialBubble = true;
      try {
        await playPointLaunch(pointEl, pointer);
      } catch (error) {
        console.error('Impossible de jouer l animation de lancement :', error);
      }

      viewer.style.display = 'block';
      viewer.style.pointerEvents = 'auto';
      viewer.setAttribute('aria-hidden', 'false');
      isFullscreenMode = false;
      viewer.classList.remove('fullscreen');

      const target = getTargetRect();
      setRect(shell, activePointRect);
      setRect(halo, activePointRect);
      setBubblePosition(target, activeRegion);
      hideBubble(true);
      updateModeIndicator();
      updateModeIndicator();

      activeVariants = Array.isArray(activePointData.variants) && activePointData.variants.length > 0
        ? activePointData.variants
        : [{ webm: activePointData.video, jpeg: activePointData.jpeg, poeticText: [], scientificText: [], latitude: null, longitude: null, date: null, game: null }];
      console.log('openVideo variants', activeVariants);
      const hasVariantNavigator = activeVariants.length > 1;
      activeVariantIndex = 0;
      setActiveVariant(0);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          viewer.classList.add('open');
          body.classList.add('video-open');
          setRect(shell, target);
          setRect(halo, getHaloRect(activePointRect, target));
          if (!viewer.classList.contains('image-mode')) {
            video.play().catch(() => {});
          }
          isOpen = true;
          lastActivatedPoint = pointEl;
          openingPoint = false;

          requestAnimationFrame(() => {
            triggerInitialVideoHighlights(hasVariantNavigator);
          });

          requestAnimationFrame(() => {
            if (pendingInitialBubble) {
              const centerX = target.left + target.width * 0.25;
              const centerY = target.top + target.height * 0.5;
              showBubble({ clientX: centerX, clientY: centerY });
              pendingInitialBubble = false;
            }
          });
        });
      });
    } catch (error) {
      openingPoint = false;
      if (!isOpen) {
        resumePoiMotion();
        syncBackgroundPlayback();
      }
      throw error;
    }
  }

  function closeVideo() {
    if (!isOpen || !activePointRect) return;

    pendingInitialBubble = false;
    hideBubble(true);
    viewer.classList.remove('open');
    body.classList.remove('video-open');
    viewer.classList.remove('fullscreen');
    isFullscreenMode = false;
    setRect(shell, activePointRect);
    setRect(halo, activePointRect);

    setTimeout(() => {
      try {
        video.pause();
        video.removeAttribute('src');
        video.load();
      } catch (e) {}
      try {
        if (imageEl) {
          imageEl.removeAttribute('src');
          imageEl.style.display = 'none';
        }
      } catch (e) {}
      viewer.classList.remove('image-mode');
      viewer.style.display = 'none';
      viewer.style.pointerEvents = 'none';
      viewer.setAttribute('aria-hidden', 'true');
      isOpen = false;
      activePointData = null;
      activeRegion = null;
      activeZoneKey = null;
      resumePoiMotion();
      syncBackgroundPlayback();
    }, 940);
  }

  points.forEach((point) => {
    point.addEventListener('click', (e) => {
      e.stopPropagation();
      openVideo(point, e);
    });
  });
  if (variantPrevBtn) {
    variantPrevBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      setActiveVariant(activeVariantIndex - 1);
    });
  }
  if (variantNextBtn) {
    variantNextBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      setActiveVariant(activeVariantIndex + 1);
    });
  }

  shell.addEventListener('mouseenter', (e) => {
    if (!isFullscreenMode) showBubble(e);
  });

  shell.addEventListener('wheel', (event) => {
    if (!isOpen) return;
    event.preventDefault();
    if (event.deltaY < 0) {
      setFullscreenMode(true);
    } else if (isFullscreenMode) {
      setFullscreenMode(false);
    } else if (Date.now() - fullscreenExitAt > 1000) {
      closeVideo();
    }
  });

  shell.addEventListener('click', (event) => {
    if (!isOpen) return;
    event.stopPropagation();
    setFullscreenMode(!isFullscreenMode);
  });

  if (modeIndicator) {
    modeIndicator.addEventListener('click', (event) => {
      event.stopPropagation();
      setFullscreenMode(!isFullscreenMode);
    });
  }

  shell.addEventListener('mousemove', (e) => {
    if (isFullscreenMode) return;
    const rect = shell.getBoundingClientRect();
    const hoveredRegion = pickRegionFromPointer(e, rect, activeRegions);
    if (!hoveredRegion) return;

    if (hoveredRegion._zoneKey !== activeZoneKey) {
      showBubble(e);
    }
  });

  shell.addEventListener('mouseleave', () => {
    scheduleBubbleHide();
  });

  infoBubble.addEventListener('mouseenter', () => {
    clearBubbleTimer();
    if (!bubbleVisible) showBubble();
  });

  infoBubble.addEventListener('mouseleave', () => {
    scheduleBubbleHide();
  });

  closeZone.addEventListener('click', closeVideo);
  backdrop.addEventListener('click', closeVideo);
  closeBtn.addEventListener('click', closeVideo);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeVideo();
  });

  window.addEventListener('resize', () => {
    setMapState(mapState);
    syncPoiMotionLifecycle();
    if (!viewer.style.display || viewer.style.display === 'none') return;
    if (isOpen) {
      if (isFullscreenMode) {
        const fullscreenRect = getFullscreenRect();
        setRect(shell, fullscreenRect);
        if (activeRegion) {
          setBubblePosition(fullscreenRect, activeRegion, false);
        }
      } else {
        const target = getTargetRect();
        setRect(shell, target);
        if (activeRegion) {
          setBubblePosition(target, activeRegion, false);
        }
      }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      pausePoiMotion();
      return;
    }
    if (!isOpen) {
      resumePoiMotion();
    }
  });

  function getSavedAudioVolume() {
    const saved = localStorage.getItem('siteBaladeChampvertAudioVolume');
    const parsed = parseFloat(saved);
    return Number.isFinite(parsed) && parsed >= 0 && parsed <= 1 ? parsed : 0.55;
  }

  function saveAudioVolume(value) {
    localStorage.setItem('siteBaladeChampvertAudioVolume', String(value));
  }

  function updateAudioToggleState() {
    const isActive = !!audioToggleBtn && audioToggleBtn.classList.contains('active');
    if (!audioToggleBtn || !audioVolumeControl) return;

    audioToggleBtn.classList.toggle('active', isActive);
    audioToggleBtn.setAttribute('aria-pressed', String(isActive));
    audioToggleBtn.setAttribute('aria-label', isActive ? 'Désactiver le son de fond' : 'Activer le son de fond');
    audioVolumeControl.classList.toggle('hidden', !isActive);
    audioVolumeControl.setAttribute('aria-hidden', String(!isActive));
  }

  function setBackgroundAudioVolume(value) {
    const normalized = Math.min(1, Math.max(0, Number(value)));
    if (backgroundAudio) {
      backgroundAudio.volume = normalized;
    }
    if (audioVolumeRange) {
      audioVolumeRange.value = String(normalized);
    }
    saveAudioVolume(normalized);
  }

  function setBackgroundAudioEnabled(shouldEnable) {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const isActive = !!shouldEnable;
    audioToggleBtn.classList.toggle('active', isActive);
    audioToggleBtn.setAttribute('aria-pressed', String(isActive));
    audioToggleBtn.setAttribute('aria-label', isActive ? 'Désactiver le son de fond' : 'Activer le son de fond');
    audioVolumeControl.classList.toggle('hidden', !isActive);
    audioVolumeControl.setAttribute('aria-hidden', String(!isActive));

    if (isActive) {
      backgroundAudio.volume = Number(audioVolumeRange.value) || getSavedAudioVolume();
      backgroundAudio.play().catch((error) => {
        console.warn('Impossible de démarrer le son de fond :', error);
      });
    } else {
      backgroundAudio.pause();
    }
  }

  function toggleBackgroundAudio() {
    if (!audioToggleBtn) return;
    setBackgroundAudioEnabled(!audioToggleBtn.classList.contains('active'));
  }

  function initializeBackgroundAudioControls() {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const startingVolume = getSavedAudioVolume();
    audioVolumeRange.value = String(startingVolume);
    backgroundAudio.volume = startingVolume;
    audioToggleBtn.classList.remove('active');
    audioToggleBtn.setAttribute('aria-pressed', 'false');
    audioToggleBtn.setAttribute('aria-label', 'Activer le son de fond');
    audioVolumeControl.classList.add('hidden');
    audioVolumeControl.setAttribute('aria-hidden', 'true');

    audioToggleBtn.addEventListener('click', (event) => {
      event.preventDefault();
      toggleBackgroundAudio();
    });

    audioVolumeRange.addEventListener('input', (event) => {
      const target = /** @type {HTMLInputElement} */ (event.target);
      if (!target) return;
      setBackgroundAudioVolume(target.value);
    });
  }

  function getSiteInfoText() {
    const strings = localeStrings[currentLocale] || localeStrings.FR;
    return strings.infoTooltipText || '';
  }

  function updateSiteInfoButtonLanguage() {
    if (!infoToggleBtn) return;
    const strings = localeStrings[currentLocale] || localeStrings.FR;
    const label = strings.infoButtonLabel || 'Maison des curiosités';
    const ariaLabel = strings.infoButtonAriaLabel || 'Ouvrir la Maison des curiosités';
    const labelElement = infoToggleBtn.querySelector('.site-info-button-text');
    if (labelElement) {
      labelElement.textContent = label;
    }
    infoToggleBtn.setAttribute('aria-label', ariaLabel);
  }

  function renderSiteInfoText() {
    const text = getSiteInfoText();
    if (!infoTooltip) return;
    const paragraphs = text
      .split('\n')
      .map((line) => line.trim())
      .filter(Boolean)
      .map((line) => `<p>${escapeHtml(line)}</p>`)
      .join('');
    infoTooltip.innerHTML = paragraphs;
  }

  function setInfoTooltipOpen(isOpen) {
    if (!infoTooltip || !infoToggleBtn) return;
    infoTooltip.classList.toggle('visible', isOpen);
    infoTooltip.setAttribute('aria-hidden', String(!isOpen));
    infoToggleBtn.setAttribute('aria-expanded', String(isOpen));
  }

  function showSiteInfoTooltip() {
    if (!infoTooltip) return;
    renderSiteInfoText();
    setInfoTooltipOpen(true);
  }

  function hideSiteInfoTooltip() {
    setInfoTooltipOpen(false);
  }

  function initializeSiteInfoControls() {
    if (!infoToggleBtn || !infoTooltip) return;

    infoToggleBtn.addEventListener('mouseenter', () => showSiteInfoTooltip());
    infoToggleBtn.addEventListener('focus', () => showSiteInfoTooltip());
    infoToggleBtn.addEventListener('mouseleave', () => {
      window.setTimeout(() => {
        if (!infoToggleBtn.matches(':hover') && !infoTooltip.matches(':hover')) {
          hideSiteInfoTooltip();
        }
      }, 100);
    });

    infoTooltip.addEventListener('mouseenter', () => showSiteInfoTooltip());
    infoTooltip.addEventListener('mouseleave', () => {
      window.setTimeout(() => {
        if (!infoToggleBtn.matches(':hover') && !infoTooltip.matches(':hover')) {
          hideSiteInfoTooltip();
        }
      }, 100);
    });
  }

  updateMapToggleText();
  updateSiteInfoButtonLanguage();
  applyMapTransform();
  scheduleIdlePoiHighlight();
  loadPoiData();
  loadBackgroundList();
  initializeBackgroundAudioControls();
  initializeSiteInfoControls();
  runIntro();
</script>
<script src="https://cdn.jsdelivr.net/gh/cnumr/ecoindex_badge@3/assets/js/ecoindex-badge.js" defer></script>
</body>
