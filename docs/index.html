<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carte sensible - Champvert</title>
<style>
  :root {
    --bg: #edf1e7;
    --panel: rgba(255, 255, 255, 0.88);
    --line: rgba(66, 87, 62, 0.14);
    --text: #233121;
    --muted: #5f705c;
    --shadow: rgba(21, 30, 18, 0.12);
    --overlay: rgba(0, 0, 0, 0.72);
    --map-opacity: 0;
    --stage-width: min(96vw, calc(96vh * 1.5948795181));
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at top left, rgba(185, 206, 156, 0.3), transparent 38%),
      radial-gradient(circle at bottom right, rgba(199, 213, 171, 0.28), transparent 34%),
      linear-gradient(180deg, #f7faf4 0%, var(--bg) 100%);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body.show-map {
    --map-opacity: 1;
  }

  body:not(.intro-complete) .map-toggle,
  body:not(.intro-complete) .map-controls,
  body:not(.intro-complete) .map-hint,
  body:not(.intro-complete) .caption {
    opacity: 0;
    pointer-events: none;
  }

  .app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .map-toggle {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid rgba(82, 106, 74, 0.16);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 12px 28px var(--shadow);
    backdrop-filter: blur(10px);
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    --toggle-x: 18px;
    --toggle-y: 18px;
    --toggle-lift: 0px;
    transform: translate(var(--toggle-x), var(--toggle-y)) translateY(var(--toggle-lift));
    transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }

  .map-toggle:hover,
  .map-toggle:focus-visible {
    --toggle-lift: -1px;
    box-shadow: 0 16px 34px rgba(21, 30, 18, 0.16);
    background: rgba(255, 255, 255, 0.94);
  }

  .map-toggle:focus-visible {
    outline: 2px solid rgba(80, 118, 66, 0.35);
    outline-offset: 3px;
  }

  .map-toggle svg {
    width: 18px;
    height: 18px;
    fill: #54724d;
    flex: 0 0 auto;
  }

  .map-toggle strong {
    display: block;
    font-size: 0.92rem;
    line-height: 1.1;
  }

  .map-toggle span {
    display: block;
    margin-top: 2px;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.15;
  }

  .map-toggle-copy {
    min-width: 0;
  }

  .map-toggle-pin {
    margin-left: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    pointer-events: auto;
  }

  .map-toggle-pin input {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: #54724d;
    cursor: pointer;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 76px 2vw 3vh;
  }

  .map-frame {
    position: relative;
    width: var(--stage-width);
    aspect-ratio: 2118 / 1328;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 24px 70px rgba(34, 47, 28, 0.16),
      inset 0 0 0 1px rgba(91, 113, 79, 0.08);
    background: #ffffff;
  }

  .map-viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }

  .map-viewport.is-dragging {
    cursor: grabbing;
  }

  .map-scene {
    position: absolute;
    inset: 0;
    transform-origin: 0 0;
    will-change: transform;
    user-select: none;
    -webkit-user-select: none;
  }

  .map-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--line);
    border-radius: 24px;
    pointer-events: none;
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }

  .layer-map {
    object-fit: contain;
    opacity: var(--map-opacity);
    transition: opacity 1s ease;
  }

  .layer-svg {
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .layer-svg-outline {
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.45s ease;
  }

  .poi-layer {
    z-index: 4;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: auto;
  }

  body.reveal-outline .layer-svg-outline,
  body.reveal-shape .layer-svg-outline,
  body.intro-complete .layer-svg-outline,
  body.reveal-shape .layer-svg,
  body.reveal-shape .poi-layer,
  body.intro-complete .layer-svg,
  body.intro-complete .poi-layer {
    opacity: 1;
  }

  .zone-flight {
    position: fixed;
    z-index: 35;
    pointer-events: none;
    opacity: 0.92;
    will-change: transform, opacity;
  }

  .zone-flight svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 18px 34px rgba(96, 67, 42, 0.22));
  }

  .point {
    fill: rgba(255, 255, 255, 0.78);
    stroke: #4d6a4a;
    stroke-width: 1.8;
    cursor: pointer;
    vector-effect: non-scaling-stroke;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.25s ease, fill 0.25s ease, opacity 0.25s ease, stroke 0.25s ease;
  }

  .point:hover {
    fill: #ffffff;
    stroke: #6f925f;
    transform: scale(1.22);
  }

  .point-pulse {
    fill: rgba(154, 202, 101, 0.16);
    stroke: rgba(121, 168, 77, 0.2);
    stroke-width: 1;
    pointer-events: none;
    transform-origin: center;
    animation: pulse 2.8s ease-in-out infinite;
  }

  #poiTooltip {
    position: absolute;
    left: 0;
    top: 0;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(20, 24, 16, 0.9);
    color: #fff;
    font-size: 0.78rem;
    line-height: 1.4;
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -120%) scale(0.92);
    opacity: 0;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
  }

  #poiTooltip.visible {
    opacity: 1;
    transform: translate(-50%, -120%) scale(1);
  }

  @keyframes pulse {
    0% { transform: scale(0.82); opacity: 0.22; }
    50% { transform: scale(1.12); opacity: 0.5; }
    100% { transform: scale(0.82); opacity: 0.22; }
  }

  .caption {
    position: absolute;
    right: 18px;
    bottom: 18px;
    z-index: 5;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.82);
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.35;
    box-shadow: 0 10px 24px rgba(34, 47, 28, 0.08);
    backdrop-filter: blur(6px);
    transition: opacity 0.6s ease;
  }

  .caption a {
    color: inherit;
    text-decoration: none;
  }

  .caption a:hover,
  .caption a:focus-visible {
    text-decoration: underline;
  }

  .audio-control {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 40;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text);
    box-shadow: 0 18px 40px rgba(21, 30, 18, 0.14);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(82, 106, 74, 0.12);
    font-size: 0.88rem;
    pointer-events: auto;
  }

  .audio-control button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 999px;
    background: #fcfdf7;
    color: #54724d;
    cursor: pointer;
    transition: background 180ms ease, transform 180ms ease;
  }

  .audio-control button:hover,
  .audio-control button:focus-visible {
    background: #eef4e0;
  }

  .audio-control button.active {
    background: #e8f1d8;
  }

  .audio-control svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    pointer-events: none;
  }

  .audio-volume {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity 180ms ease, visibility 180ms ease;
  }

  .audio-volume.hidden {
    opacity: 0;
    visibility: hidden;
    width: 0;
    overflow: hidden;
  }

  .audio-volume input[type="range"] {
    width: 110px;
    accent-color: #54724d;
    cursor: pointer;
    background: transparent;
  }

  #backgroundAudio {
    display: none;
  }

  .map-controls {
    position: absolute;
    right: 18px;
    top: 18px;
    z-index: 21;
    display: flex;
    gap: 8px;
  }

  .map-control {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(82, 106, 74, 0.16);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.88);
    color: var(--text);
    font: inherit;
    font-size: 1rem;
    line-height: 1;
    box-shadow: 0 12px 28px var(--shadow);
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }

  .map-control:hover,
  .map-control:focus-visible {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 16px 34px rgba(21, 30, 18, 0.16);
  }

  .map-control:focus-visible {
    outline: 2px solid rgba(80, 118, 66, 0.35);
    outline-offset: 3px;
  }

  .language-switcher {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 6px;
  }

  .map-control--lang {
    width: 34px;
    height: 34px;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0;
  }

  .map-control--lang.active {
    background: rgba(82, 106, 74, 0.18);
    border-color: rgba(82, 106, 74, 0.32);
  }

  .map-hint {
    position: absolute;
    left: 18px;
    top: 92px;
    z-index: 19;
    max-width: min(260px, calc(100% - 36px));
    padding: 9px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.76);
    color: var(--muted);
    font-size: 0.76rem;
    line-height: 1.35;
    box-shadow: 0 10px 24px rgba(34, 47, 28, 0.08);
    backdrop-filter: blur(6px);
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .site-info-button {
    position: fixed;
    left: 18px;
    bottom: 18px;
    z-index: 40;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 999px;
    background: #1d4ed8;
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 18px 36px rgba(29, 78, 216, 0.16);
    transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }

  .site-info-button:hover,
  .site-info-button:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 22px 40px rgba(29, 78, 216, 0.24);
    background: #2563eb;
  }

  .site-info-tooltip {
    position: fixed;
    left: 18px;
    bottom: 80px;
    z-index: 41;
    max-width: min(360px, calc(100vw - 36px));
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(20, 25, 44, 0.96);
    color: #ffffff;
    font-size: 0.9rem;
    line-height: 1.5;
    box-shadow: 0 22px 48px rgba(9, 12, 29, 0.28);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .site-info-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .site-info-tooltip p {
    margin: 0 0 0.9em;
  }

  .site-info-tooltip p:last-child {
    margin-bottom: 0;
  }

  #viewer {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    pointer-events: none;
  }

  #backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    transition: background 680ms ease;
  }

  #viewer.open #backdrop {
    background: var(--overlay);
  }

  #closeZone {
    position: absolute;
    inset: 0;
    cursor: pointer;
  }

  #halo {
    position: absolute;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.12) 35%, rgba(255, 255, 255, 0.02) 70%, rgba(255, 255, 255, 0) 100%);
    opacity: 0;
    transition:
      left 760ms cubic-bezier(0.22, 1, 0.36, 1),
      top 760ms cubic-bezier(0.22, 1, 0.36, 1),
      width 760ms cubic-bezier(0.22, 1, 0.36, 1),
      height 760ms cubic-bezier(0.22, 1, 0.36, 1),
      opacity 420ms ease;
    pointer-events: none;
  }

  #viewer.open #halo {
    opacity: 1;
  }

  #mediaWrap {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #videoShell {
    position: absolute;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    transition:
      left 920ms cubic-bezier(0.22, 1, 0.36, 1),
      top 920ms cubic-bezier(0.22, 1, 0.36, 1),
      width 920ms cubic-bezier(0.22, 1, 0.36, 1),
      height 920ms cubic-bezier(0.22, 1, 0.36, 1),
      border-radius 920ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 920ms ease;
    pointer-events: auto;
    cursor: pointer;
  }

  #viewer.open #videoShell {
    border-radius: 18px;
    box-shadow: 0 26px 68px rgba(0, 0, 0, 0.42);
  }

  #viewer.fullscreen #videoShell {
    border-radius: 0;
  }

  #videoModeIndicator {
    position: absolute;
    left: 18px;
    top: 18px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.68);
    color: #fff;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    border: none;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 180ms ease, background 180ms ease;
  }

  #viewer.open #videoModeIndicator {
    opacity: 1;
  }

  #videoModeIndicator:hover,
  #videoModeIndicator:focus-visible {
    background: rgba(0, 0, 0, 0.78);
    outline: none;
  }

  .video-controls {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.42);
    color: #fff;
    font-size: 0.9rem;
    line-height: 1.2;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 180ms ease;
    z-index: 2;
  }

  #viewer.open .video-controls {
    opacity: 1;
  }

  .video-controls[hidden] {
    display: none;
  }

  .video-controls button {
    min-width: 34px;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
  }

  .video-controls button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .video-controls span {
    min-width: 50px;
    text-align: center;
    display: inline-block;
  }

  #viewer.fullscreen #infoBubble {
    display: none;
  }

  #videoPlayer {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity 260ms ease 240ms;
  }

  #viewer.open #videoPlayer {
    opacity: 1;
  }

  #imagePlayer {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity 260ms ease 240ms;
  }

  #viewer.open #imagePlayer {
    opacity: 1;
  }

  /* when image-mode is active, ensure only image shows */
  #viewer.image-mode #videoPlayer {
    opacity: 0 !important;
  }

  #viewer.image-mode #imagePlayer {
    opacity: 1 !important;
  }

  #infoBubble {
    position: absolute;
    width: min(340px, 28vw);
    min-width: 240px;
    min-height: 120px;
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(246, 248, 243, 0.95);
    color: #263426;
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(6px);
    opacity: 0;
    transform: translateX(18px) translateY(8px) scale(0.98);
    transition:
      opacity 340ms ease,
      transform 460ms cubic-bezier(0.22, 1, 0.36, 1),
      left 920ms cubic-bezier(0.22, 1, 0.36, 1),
      top 920ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: auto;
  }

  #infoBubble::before {
    content: "";
    position: absolute;
    left: -30px;
    top: var(--tail-top, 38px);
    width: 38px;
    height: 10px;
    background: rgba(246, 248, 243, 0.95);
    clip-path: polygon(0 50%, 100% 0, 86% 50%, 100% 100%);
    transform: rotate(var(--tail-rotate, -18deg));
    transform-origin: left center;
    filter: drop-shadow(-2px 2px 2px rgba(0, 0, 0, 0.05));
  }

  #infoBubble.visible {
    opacity: 1;
    transform: translateX(0) translateY(0) scale(1);
    pointer-events: auto;
  }

  #infoBubble .zoneLabel {
    margin: 0 0 8px;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.62;
  }

  #infoBubble h3 {
    margin: 0 0 10px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  #infoBubble p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.45;
  }

  #closeBtn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 250ms ease 440ms, background 180ms ease;
    pointer-events: auto;
  }

  #viewer.open #closeBtn {
    opacity: 1;
  }

  #closeBtn:hover {
    background: rgba(255, 255, 255, 0.24);
  }

  @media (max-width: 900px) {
    :root {
      --stage-width: min(97vw, calc(90vh * 1.5948795181));
    }

    .stage {
      padding-top: 86px;
    }

    .map-frame {
      border-radius: 18px;
    }

    .map-frame::after {
      border-radius: 18px;
    }

    #infoBubble {
      width: min(300px, 42vw);
      min-width: 220px;
    }
  }

  @media (max-width: 700px) {
    .map-toggle {
      max-width: calc(100% - 24px);
      padding: 11px 13px;
    }

    .map-toggle strong {
      font-size: 0.88rem;
    }

    .map-toggle span {
      font-size: 0.74rem;
    }

    .stage {
      padding: 84px 1.5vw 2vh;
    }

    .caption {
      left: 12px;
      right: 12px;
      bottom: 12px;
      font-size: 0.74rem;
    }

    .map-controls {
      top: auto;
      right: 12px;
      bottom: 84px;
    }

    .map-hint {
      top: 86px;
      left: 12px;
      max-width: calc(100% - 24px);
      font-size: 0.72rem;
    }

    #infoBubble {
      width: min(88vw, 340px);
      left: 50% !important;
      transform: translateX(-50%) translateY(8px) scale(0.98);
    }

    #infoBubble::before {
      left: 50%;
      top: -16px;
      width: 30px;
      height: 14px;
      transform: translateX(-50%) rotate(90deg);
      clip-path: polygon(0 50%, 100% 0, 86% 50%, 100% 100%);
    }

    #infoBubble.visible {
      transform: translateX(-50%) translateY(0) scale(1);
    }
  }

  .audio-control {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 40;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text);
    box-shadow: 0 18px 40px rgba(21, 30, 18, 0.14);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(82, 106, 74, 0.12);
    font-size: 0.88rem;
    pointer-events: auto;
  }

  .audio-control button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 999px;
    background: #fcfdf7;
    color: #54724d;

<script>
  const body = document.body;
  const mapToggle = document.getElementById('mapToggle');

  const audioVolumeControl = document.getElementById('audioVolumeControl');
  const audioVolumeRange = document.getElementById('audioVolumeRange');

  const poiMediaPathPrefix = 'data/';
  const pointVariants = new WeakMap();
  const langFrBtn = document.getElementById('langFrBtn');
  const langEnBtn = document.getElementById('langEnBtn');
  if (video) {
    video.addEventListener('error', (event) => {
      console.error('Video playback error', event);
    });
    video.addEventListener('stalled', () => {
      console.warn('Video stalled', video.src);
    });
  }
  const mapToggleTitleElement = document.querySelector('.map-toggle-copy strong');
  const mapToggleSubtitleElement = document.querySelector('.map-toggle-copy span');
  let points = [];
  let rawImages = [];
  let currentLocale = 'FR';
  const localeStrings = {
    FR: {
      toggleTitle: 'Voir la carte',
      toggleSubtitle: 'La carte est affichée par défaut',
      mapToggleAria: 'Afficher la superposition avec la carte OpenStreetMap',
      mapToggleTitle: 'Survolez pour afficher la carte réelle',
      learnMoreLabel: 'Pour aller plus loin :',
      infoButtonLabel: 'Info',
      infoTooltipText: 'Bienvenu dans cette découverte originale de la nature qui vous entoure. L\'homme y cohabite, mais elle est bien là, résiliente, adaptée, menant sa propre vie.\n\nLe lieu représente une petite jungle apprivoisée d\'un petit quartier de Lyon, entouré de bois, suffisamment pour y faire des rencontres régalantes et ressourçantes.\n\nToutes les images et sons sont originales et natives de l\'endroit. Malgré une frontière proche des habitats, il suffit d\'ouvrir les yeux et les oreilles, pour accéder à un monde parallèle lent, calme, différent et énergisant.\n\nSoyez curieux, n\'ayez pas peur de cliquer, d\'utiliser la molette, d\'essayer, rien n\'est expliqué, c\'est voulu, à vous de découvrir.\n\nIl n\'est ici aucunement question de commerce, aucun cookie de suivi. Aucune publicité. Aucune collecte de données personnelles, mais une obséssion dans l\'éco conception, avec des affichages légers comme les stars à l\'honneur ici, et un ressenti que nous espérons naturel et fluide.\n\ncontact Webmaster : albouille69@gmail.com'
    },
    US: {
      toggleTitle: 'View map',
      toggleSubtitle: 'The map is shown by default',
      mapToggleAria: 'Show the overlay with the OpenStreetMap map',
      mapToggleTitle: 'Hover to show the real map',
      learnMoreLabel: 'To go further:',
      infoButtonLabel: 'Info',
      infoTooltipText: 'Welcome to this original discovery of the nature around you. Humans live here too, but nature is present, resilient, adapted, and leading its own life.\n\nThis place represents a small tamed jungle in a small Lyon neighborhood, surrounded by woods, enough to offer rich and refreshing encounters.\n\nAll images and sounds are original and native to the place. Despite a nearby border of inhabited areas, simply open your eyes and ears to access a parallel world that is slow, calm, different and energizing.\n\nBe curious, don\'t be afraid to click, use the wheel, try things; nothing is explained, it is intentional, for you to discover.\n\nThis is not about commerce, no tracking cookies. No advertising. No personal data collection, but an obsession with eco-design, with lightweight displays like the stars honored here, and a feeling we hope is natural and fluid.\n\ncontact Webmaster: albouille69@gmail.com'
    }
  };

  let activePointRect = null;
  let activePointData = null;
  let activeRegions = [];
  let activeRegion = null;
  let activeZoneKey = null;
  let pendingInitialBubble = false;
  let isOpen = false;
  let isFullscreenMode = false;
  let bubbleVisible = false;
  let hideBubbleTimer = null;
  let introStarted = false;
  let mapPinned = mapPinToggle.checked;
  let openingPoint = false;
  let lastActivatedPoint = null;
  let activeVariants = [];
  let activeVariantIndex = 0;
  const minScale = 1;
  const maxScale = 4;
  const zoomStep = 0.2;
  const toggleAnchor = { x: 18, y: 18 };
  let mapState = { scale: 1, x: 0, y: 0 };
  let dragState = null;
  const activePointers = new Map();
  let pinchState = null;
  const zonePolygonPoints = [
    [208, 150], [215, 152], [378, 351], [477, 428], [579, 463], [1044, 377], [1269, 344],
    [1308, 340], [1353, 343], [1448, 358], [1509, 374], [1667, 465], [1726, 526], [1779, 556],
    [1909, 607], [1907, 615], [1810, 728], [1784, 790], [1662, 1201], [1579, 1207], [1469, 1182],
    [1464, 1133], [1549, 1012], [1657, 1043], [1706, 888], [1706, 883], [1687, 863], [1727, 744],
    [1794, 634], [1794, 624], [1637, 559], [1617, 518], [1521, 456], [1398, 426], [1246, 414],
    [915, 478], [729, 531], [709, 742], [780, 774], [769, 829], [767, 833], [763, 833], [666, 803],
    [428, 615], [449, 485], [304, 345]
  ];
  const zonePathD = `${zonePolygonPoints.map(([x, y], index) => `${index === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ')} Z`;
  const zoneCentroid = computePolygonCentroid(zonePolygonPoints);

  function computePolygonCentroid(points) {
    let twiceArea = 0;
    let centroidX = 0;
    let centroidY = 0;

    for (let index = 0; index < points.length; index += 1) {
      const [x1, y1] = points[index];
      const [x2, y2] = points[(index + 1) % points.length];
      const cross = (x1 * y2) - (x2 * y1);

      twiceArea += cross;
      centroidX += (x1 + x2) * cross;
      centroidY += (y1 + y2) * cross;
    }

    if (Math.abs(twiceArea) < 0.0001) {
      const fallback = points.reduce((sum, [x, y]) => ({ x: sum.x + x, y: sum.y + y }), { x: 0, y: 0 });
      return { x: fallback.x / points.length, y: fallback.y / points.length };
    }

    return {
      x: centroidX / (3 * twiceArea),
      y: centroidY / (3 * twiceArea)
    };
  }

  function getViewportRect() {
    return mapViewport.getBoundingClientRect();
  }

  function clampMapState(nextState) {
    const rect = getViewportRect();
    const scale = Math.min(maxScale, Math.max(minScale, nextState.scale));
    const minX = rect.width - (rect.width * scale);
    const minY = rect.height - (rect.height * scale);

    return {
      scale,
      x: Math.min(0, Math.max(minX, nextState.x)),
      y: Math.min(0, Math.max(minY, nextState.y))
    };
  }

  function getPreferredText(list, fallback = '_') {
    if (!Array.isArray(list)) return fallback;
    const preferred = list.find((entry) => Object.prototype.hasOwnProperty.call(entry, currentLocale) && entry[currentLocale] && entry[currentLocale] !== '_');
    if (preferred) return preferred[currentLocale];

    const fr = list.find((entry) => Object.prototype.hasOwnProperty.call(entry, 'FR') && entry.FR && entry.FR !== '_');
    if (fr) return fr.FR;

    const first = list[0];
    if (first) {
      const key = Object.keys(first)[0];
      const value = first[key];
      if (value && value !== '_') return value;
    }
    return fallback;
  }

  function getTextByLocale(list, localeKey) {
    if (!Array.isArray(list)) return '';
    const entry = list.find((item) => Object.prototype.hasOwnProperty.call(item, localeKey) && item[localeKey] && item[localeKey] !== '_');
    return entry ? entry[localeKey] : '';
  }

  function getPreferredNameWithScientific(list, fallback = 'Observation') {
    const name = getPreferredText(list, fallback);
    const scientific = getTextByLocale(list, 'SC');
    return scientific ? `${name} - ${scientific}` : name;
  }

  function normalizeVariants(image) {
    const mainWebm = (image.webm && image.webm !== '_') ? `${poiMediaPathPrefix}${image.webm}` : '_';
    const mainJpeg = (image.jpeg && image.jpeg !== '_') ? `${poiMediaPathPrefix}${image.jpeg}` : '_';
    const variants = [
      {
        webm: mainWebm,
        jpeg: mainJpeg,
        poeticText: Array.isArray(image.poeticText) ? image.poeticText : [],
        scientificText: Array.isArray(image.scientificText) ? image.scientificText : [],
        latitude: image.latitude,
        longitude: image.longitude,
        date: image.date,
        game: image.game
      }
    ];

    if (Array.isArray(image.otherImage)) {
      image.otherImage.forEach((other) => {
        if (!other || typeof other !== 'object') return;
        variants.push({
          // Do NOT fallback to mainWebm for other variants: if other.webm is absent,
          // treat it as no-webm so the jpeg fallback can be used.
          webm: (other.webm && other.webm !== '_') ? `${poiMediaPathPrefix}${other.webm}` : '_',
          jpeg: (other.jpeg && other.jpeg !== '_') ? `${poiMediaPathPrefix}${other.jpeg}` : mainJpeg,
          poeticText: Array.isArray(other.poeticText) ? other.poeticText : [],
          scientificText: Array.isArray(other.scientificText) ? other.scientificText : [],
          latitude: other.latitude,
          longitude: other.longitude,
          date: other.date,
          game: other.game
        });
      });
    }

    return variants;
  }

  function getVariantText(variantList, mainList, fallbackText) {
    if (Array.isArray(variantList)) {
      const candidate = getPreferredText(variantList, null);
      if (candidate && candidate !== '_') return candidate;
    } else if (typeof variantList === 'string' && variantList && variantList !== '_') {
      return variantList;
    }
    if (Array.isArray(mainList)) {
      return getPreferredText(mainList, fallbackText);
    }
    if (typeof mainList === 'string' && mainList && mainList !== '_') {
      return mainList;
    }
    return fallbackText;
  }

  function getActiveVariantInfo() {
    const variant = activeVariants[activeVariantIndex] || {};
    const poetic = getVariantText(variant.poeticText, activePointData?.poetic || '', '');
    const scientific = getVariantText(variant.scientificText, activePointData?.scientific || '', '');
    return {
      poetic,
      scientific,
      html: buildInfoHtml(poetic, scientific, activePointData?.links || [])
    };
  }

  function updateMapToggleText() {
    const strings = localeStrings[currentLocale] || localeStrings.FR;
    if (mapToggleTitleElement) mapToggleTitleElement.textContent = strings.toggleTitle;
    if (mapToggleSubtitleElement) mapToggleSubtitleElement.textContent = strings.toggleSubtitle;
    if (mapToggle) {
      mapToggle.setAttribute('aria-label', strings.mapToggleAria);
      mapToggle.setAttribute('title', strings.mapToggleTitle);
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function buildInfoHtml(poetic, scientific, links) {
    const htmlParts = [];
    if (poetic) {
      htmlParts.push(`<p>${escapeHtml(poetic)}</p>`);
    }
    if (poetic && scientific) {
      htmlParts.push('<br/>');
    }
    if (scientific) {
      htmlParts.push(`<p>${escapeHtml(scientific)}</p>`);
    }
    if (Array.isArray(links) && links.length > 0) {
      const label = (localeStrings[currentLocale] || localeStrings.FR).learnMoreLabel;
      const linkItems = links
        .map((href) => {
          const safeHref = escapeHtml(href);
          return `<li><a href="${safeHref}" target="_blank" rel="noopener noreferrer">${safeHref}</a></li>`;
        })
        .join('');
      htmlParts.push(`<br/><p>${escapeHtml(label)}</p><ul class="info-links">${linkItems}</ul>`);
    }
    return htmlParts.join('');
  }

  function getPointData(pointEl) {
    const poetic = pointEl.dataset.poetic || '';
    const scientific = pointEl.dataset.scientific || '';
    let links = [];
    let variants = pointVariants.get(pointEl) || [];
    try {
      links = JSON.parse(pointEl.dataset.links || '[]');
    } catch (error) {
      links = [];
    }
    return {
      video: pointEl.dataset.video,
      jpeg: pointEl.dataset.jpeg,
      title: pointEl.dataset.title || 'Observation',
      text: pointEl.dataset.text || 'Texte à venir.',
      poetic,
      scientific,
      links,
      variants,
      html: buildInfoHtml(poetic, scientific, links)
    };
  }

  function setActiveVariant(index) {
    if (!Array.isArray(activeVariants) || activeVariants.length === 0) return;
    const clampedIndex = Math.max(0, Math.min(index, activeVariants.length - 1));
    const variant = activeVariants[clampedIndex] || {};
    activeVariantIndex = clampedIndex;
    const hasWebm = variant.webm && variant.webm !== '_' ;
    const hasJpeg = variant.jpeg && variant.jpeg !== '_';

    console.debug('setActiveVariant', { index: clampedIndex, variant });
    if (hasWebm) {
      // show video, hide image
      viewer.classList.remove('image-mode');
      try {
        imageEl?.removeAttribute('src');
      } catch (e) {}
      // ensure display states
      if (imageEl) imageEl.style.display = 'none';
      if (video) video.style.display = 'block';

      if (video.getAttribute('src') !== variant.webm) {
        video.pause();
        video.muted = true;
        video.src = variant.webm;
        video.load();
        video.play().catch((error) => {
          console.error('Video play failed for', variant.webm, error);
        });
      }
    } else if (hasJpeg) {
      // show image, hide video
      viewer.classList.add('image-mode');
      try {
        video.pause();
        video.removeAttribute('src');
        video.load();
      } catch (e) {}
      // ensure display states
      if (video) video.style.display = 'none';
      if (imageEl) imageEl.style.display = 'block';

      if (imageEl && imageEl.getAttribute('src') !== variant.jpeg) {
        console.debug('loading image', variant.jpeg);
        imageEl.src = variant.jpeg;
        // set alt to title when available
        try { imageEl.alt = activePointData?.title || ''; } catch (e) {}
      }
    } else {
      // nothing valid: hide media
      viewer.classList.remove('image-mode');
      try {
        video.pause();
        video.removeAttribute('src');
        video.load();
        imageEl?.removeAttribute('src');
      } catch (e) {}
    }
    updateVariantControls();
    if (bubbleVisible && activePointData) {
      const activeInfo = getActiveVariantInfo();
      infoTitle.textContent = activePointData.title;
      infoText.innerHTML = activeInfo.html || escapeHtml(activePointData.text);
    }
  }

  function updateVariantControls() {
    if (!variantPrevBtn || !variantNextBtn || !variantPositionLabel) return;
    const count = activeVariants.length;
    if (count > 1) {
      variantPrevBtn.disabled = activeVariantIndex <= 0;
      variantNextBtn.disabled = activeVariantIndex >= count - 1;
      variantPositionLabel.textContent = `${activeVariantIndex + 1} / ${count}`;
      variantPrevBtn.removeAttribute('hidden');
      variantNextBtn.removeAttribute('hidden');
      variantPositionLabel.removeAttribute('hidden');
      document.getElementById('videoControls')?.removeAttribute('hidden');
    } else {
      document.getElementById('videoControls')?.setAttribute('hidden', '');
    }
  }

  function setActiveLocale(locale) {
    currentLocale = locale === 'US' ? 'US' : 'FR';
    if (langFrBtn) {
      langFrBtn.classList.toggle('active', currentLocale === 'FR');
      langFrBtn.setAttribute('aria-pressed', String(currentLocale === 'FR'));
    }
    if (langEnBtn) {
      langEnBtn.classList.toggle('active', currentLocale === 'US');
      langEnBtn.setAttribute('aria-pressed', String(currentLocale === 'US'));
    }
    updateMapToggleText();
    refreshPoiLayer();
    if (isOpen && lastActivatedPoint) {
      activePointData = getPointData(lastActivatedPoint);
      if (Array.isArray(activePointData.variants) && activePointData.variants.length > 0) {
        activeVariants = activePointData.variants;
        activeVariantIndex = Math.min(activeVariantIndex, activeVariants.length - 1);
        setActiveVariant(activeVariantIndex);
      } else if (bubbleVisible) {
        if (variantPrevBtn) variantPrevBtn.disabled = true;
        if (variantNextBtn) variantNextBtn.disabled = true;
        if (variantPositionLabel) variantPositionLabel.textContent = '1 / 1';
        infoTitle.textContent = activePointData.title;
        const activeInfo = getActiveVariantInfo();
        infoText.innerHTML = activeInfo.html || activePointData.html || escapeHtml(activePointData.text);
      }
    }
  }

  function refreshPoiLayer() {
    poiLayer.innerHTML = '';
    points = [];
    const existingPositions = [];
    rawImages.forEach((image, index) => {
      const point = createPoiElement(image, index, existingPositions);
      points.push(point);
    });

    points.forEach((point) => {
      point.addEventListener('click', (e) => {
        e.stopPropagation();
        openVideo(point, e);
      });

      point.addEventListener('mouseenter', (e) => {
        e.stopPropagation();
        showPoiTooltip(point, e);
      });

      point.addEventListener('mousemove', (e) => {
        e.stopPropagation();
        movePoiTooltip(e);
      });

      point.addEventListener('mouseleave', () => {
        hidePoiTooltip();
      });
    });
  }

  function showPoiTooltip(point, event) {
    if (!poiTooltip || !point) return;
    const title = point.dataset.title || '';
    if (!title) return;

    const viewportRect = mapViewport.getBoundingClientRect();
    poiTooltip.textContent = title;
    poiTooltip.style.left = `${event.clientX - viewportRect.left}px`;
    poiTooltip.style.top = `${event.clientY - viewportRect.top}px`;
    poiTooltip.classList.add('visible');
    poiTooltip.setAttribute('aria-hidden', 'false');
  }

  function movePoiTooltip(event) {
    if (!poiTooltip || !poiTooltip.classList.contains('visible')) return;
    const viewportRect = mapViewport.getBoundingClientRect();
    poiTooltip.style.left = `${event.clientX - viewportRect.left}px`;
    poiTooltip.style.top = `${event.clientY - viewportRect.top}px`;
  }

  function hidePoiTooltip() {
    if (!poiTooltip) return;
    poiTooltip.classList.remove('visible');
    poiTooltip.setAttribute('aria-hidden', 'true');
  }

  function isPointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i][0];
      const yi = points[i][1];
      const xj = points[j][0];
      const yj = points[j][1];
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 0.0000001) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getRandomPointInPolygon(polygon, attempts = 300) {
    const xs = polygon.map((p) => p[0]);
    const ys = polygon.map((p) => p[1]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    for (let i = 0; i < attempts; i += 1) {
      const x = minX + Math.random() * (maxX - minX);
      const y = minY + Math.random() * (maxY - minY);
      if (isPointInPolygon(x, y, polygon)) {
        return { x, y };
      }
    }
    return { x: zoneCentroid.x, y: zoneCentroid.y };
  }

  function findNonOverlappingPoint(existingPoints, radius = 50, attempts = 300) {
    for (let tryIndex = 0; tryIndex < attempts; tryIndex += 1) {
      const candidate = getRandomPointInPolygon(zonePolygonPoints, 30);
      const tooClose = existingPoints.some((point) => {
        const dx = point.x - candidate.x;
        const dy = point.y - candidate.y;
        return Math.hypot(dx, dy) < radius * 2;
      });
      if (!tooClose) {
        return candidate;
      }
    }
    return null;
  }

  function createPoiElement(image, index, occupiedPositions) {
    const point = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const position = findNonOverlappingPoint(occupiedPositions, 42, 200);
    const cx = position ? position.x : zoneCentroid.x;
    const cy = position ? position.y : zoneCentroid.y;

    pulse.setAttribute('class', 'point-pulse');
    pulse.setAttribute('cx', String(cx));
    pulse.setAttribute('cy', String(cy));
    pulse.setAttribute('r', '28');

    point.setAttribute('class', 'point');
    point.setAttribute('cx', String(cx));
    point.setAttribute('cy', String(cy));
    point.setAttribute('r', '11');
    point.dataset.video = (image.webm && image.webm !== '_') ? `${poiMediaPathPrefix}${image.webm}` : '_';
    point.dataset.jpeg = (image.jpeg && image.jpeg !== '_') ? `${poiMediaPathPrefix}${image.jpeg}` : '_';
    point.dataset.title = getPreferredNameWithScientific(image.name, 'Observation');
    point.dataset.poetic = getPreferredText(image.poeticText, '');
    point.dataset.scientific = getPreferredText(image.scientificText, '');
    point.dataset.text = getPreferredText(image.poeticText, getPreferredText(image.scientificText, 'Texte à venir.'));
    point.dataset.links = JSON.stringify(Array.isArray(image.liensSon) ? image.liensSon.filter((link) => typeof link === 'string' && link && link !== '_') : []);
    pointVariants.set(point, normalizeVariants(image));
    point.dataset.regions = JSON.stringify([]);

    poiLayer.appendChild(pulse);
    poiLayer.appendChild(point);

    occupiedPositions.push({ x: cx, y: cy });
    return point;
  }

  async function loadPoiData() {
    try {
      const response = await fetch('data/data.json');
      if (!response.ok) {
        throw new Error(`Échec du chargement du JSON : ${response.status}`);
      }
      const rawData = await response.json();
      rawImages = Array.isArray(rawData.images) ? rawData.images : [];
      refreshPoiLayer();
    } catch (error) {
      console.error('Impossible de charger ou traiter data/data.json :', error);
    }
  }

  function updateMapTogglePosition() {
    const rect = getViewportRect();
    const toggleRect = mapToggle.getBoundingClientRect();
    const margin = window.innerWidth <= 700 ? 12 : 18;
    const rawX = mapState.x + (toggleAnchor.x * mapState.scale);
    const rawY = mapState.y + (toggleAnchor.y * mapState.scale);
    const clampedX = Math.min(rect.width - toggleRect.width - margin, Math.max(margin, rawX));
    const clampedY = Math.min(rect.height - toggleRect.height - margin, Math.max(margin, rawY));

    mapToggle.style.setProperty('--toggle-x', `${clampedX}px`);
    mapToggle.style.setProperty('--toggle-y', `${clampedY}px`);
  }

  function applyMapTransform() {
    mapScene.style.transform = `translate(${mapState.x}px, ${mapState.y}px) scale(${mapState.scale})`;
    updateMapTogglePosition();
  }

  function setMapState(nextState) {
    mapState = clampMapState(nextState);
    applyMapTransform();
  }

  function zoomAt(clientX, clientY, deltaScale) {
    const rect = getViewportRect();
    const pointerX = clientX - rect.left;
    const pointerY = clientY - rect.top;
    const nextScale = Math.min(maxScale, Math.max(minScale, mapState.scale + deltaScale));

    if (nextScale === mapState.scale) return;

    const sceneX = (pointerX - mapState.x) / mapState.scale;
    const sceneY = (pointerY - mapState.y) / mapState.scale;

    setMapState({
      scale: nextScale,
      x: pointerX - (sceneX * nextScale),
      y: pointerY - (sceneY * nextScale)
    });
  }

  function resetMapView() {
    setMapState({ scale: 1, x: 0, y: 0 });
  }

  function startDrag(pointerId, clientX, clientY) {
    dragState = {
      pointerId,
      startX: clientX,
      startY: clientY,
      originX: mapState.x,
      originY: mapState.y
    };
    mapViewport.classList.add('is-dragging');
  }

  function stopDrag() {
    dragState = null;
    mapViewport.classList.remove('is-dragging');
    window.getSelection()?.removeAllRanges();
  }

  function getPointerDistance(pointerA, pointerB) {
    return Math.hypot(pointerA.clientX - pointerB.clientX, pointerA.clientY - pointerB.clientY);
  }

  function getPointerCenter(pointerA, pointerB) {
    return {
      clientX: (pointerA.clientX + pointerB.clientX) / 2,
      clientY: (pointerA.clientY + pointerB.clientY) / 2
    };
  }

  function startPinch() {
    const pointers = Array.from(activePointers.values());
    if (pointers.length < 2) return;

    const [first, second] = pointers;
    pinchState = {
      startDistance: getPointerDistance(first, second),
      startScale: mapState.scale,
      center: getPointerCenter(first, second),
      originX: mapState.x,
      originY: mapState.y
    };
    stopDrag();
  }

  function updatePinch() {
    if (!pinchState || activePointers.size < 2) return;

    const [first, second] = Array.from(activePointers.values());
    const center = getPointerCenter(first, second);
    const nextScale = pinchState.startScale * (getPointerDistance(first, second) / pinchState.startDistance);
    const rect = getViewportRect();
    const pointerX = pinchState.center.clientX - rect.left;
    const pointerY = pinchState.center.clientY - rect.top;
    const sceneX = (pointerX - pinchState.originX) / pinchState.startScale;
    const sceneY = (pointerY - pinchState.originY) / pinchState.startScale;

    setMapState({
      scale: nextScale,
      x: (center.clientX - rect.left) - (sceneX * nextScale),
      y: (center.clientY - rect.top) - (sceneY * nextScale)
    });
  }

  mapViewport.addEventListener('wheel', (event) => {
    event.preventDefault();

  }, { passive: false });

  mapViewport.addEventListener('dblclick', (event) => {
    if (event.target.closest('.point')) return;
    zoomAt(event.clientX, event.clientY, zoomStep * 2);
  });

  mapViewport.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    if (event.target.closest('.point') || event.target.closest('.map-toggle') || event.target.closest('.map-control')) {
      return;
    }

    event.preventDefault();

    activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
    mapViewport.setPointerCapture(event.pointerId);

    if (activePointers.size === 2) {
      startPinch();
      return;
    }

    if (activePointers.size === 1) {
      startDrag(event.pointerId, event.clientX, event.clientY);
    }
  });

  mapViewport.addEventListener('pointermove', (event) => {
    if (dragState || activePointers.size >= 2) {
      event.preventDefault();
    }

    if (activePointers.has(event.pointerId)) {
      activePointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
    }

    if (activePointers.size >= 2) {
      updatePinch();
      return;
    }

    if (!dragState || dragState.pointerId !== event.pointerId) return;

    setMapState({
      scale: mapState.scale,
      x: dragState.originX + (event.clientX - dragState.startX),
      y: dragState.originY + (event.clientY - dragState.startY)
    });
  });

  function releasePointer(event) {
    activePointers.delete(event.pointerId);
    if (mapViewport.hasPointerCapture(event.pointerId)) {
      mapViewport.releasePointerCapture(event.pointerId);
    }

    if (activePointers.size < 2) {
      pinchState = null;
    }

    if (dragState && dragState.pointerId === event.pointerId) {
      stopDrag();
    }

    if (activePointers.size === 1 && !dragState) {
      const [remainingPointerId, remainingPointer] = activePointers.entries().next().value;
      startDrag(remainingPointerId, remainingPointer.clientX, remainingPointer.clientY);
    }
  }

  mapViewport.addEventListener('pointerup', releasePointer);
  mapViewport.addEventListener('pointercancel', releasePointer);
  mapViewport.addEventListener('dragstart', (event) => {
    event.preventDefault();
  });
  mapViewport.addEventListener('selectstart', (event) => {
    event.preventDefault();
  });
  mapViewport.addEventListener('pointerleave', (event) => {
    if (!mapViewport.hasPointerCapture(event.pointerId)) {
      releasePointer(event);
    }
  });

  function pointToRect(pointEl) {
    const r = pointEl.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    return {
      left: r.left,
      top: r.top,
      width: size,
      height: size
    };
  }

  function rectCenter(rect) {
    return {
      x: rect.left + (rect.width / 2),
      y: rect.top + (rect.height / 2)
    };
  }

  function getTargetRect() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const maxW = vw * 0.42;
    const maxH = vh * 0.42;
    const ratio = 16 / 9;

    let width = maxW;
    let height = width / ratio;

    if (height > maxH) {
      height = maxH;
      width = height * ratio;
    }

    const left = Math.max(36, vw * 0.17);
    const top = (vh - height) / 2;

    return { left, top, width, height };
  }

  function getFullscreenRect() {
    return {
      left: 0,
      top: 0,
      width: window.innerWidth,
      height: window.innerHeight
    };
  }

  function updateModeIndicator() {
    if (!modeIndicator) return;
    modeIndicator.textContent = isFullscreenMode ? 'Fenêtre' : 'Plein écran';
    modeIndicator.setAttribute('aria-label', isFullscreenMode ? 'Passer en mode fenêtre' : 'Passer en mode plein écran');
  }

  function setFullscreenMode(enabled) {
    if (!isOpen || isFullscreenMode === enabled) return;
    isFullscreenMode = enabled;

    if (isFullscreenMode) {
      viewer.classList.add('fullscreen');
      hideBubble(true);
      const fullscreenRect = getFullscreenRect();
      setRect(shell, fullscreenRect);
      setRect(halo, getHaloRect(activePointRect, fullscreenRect));
      setBubblePosition(fullscreenRect, activeRegion, true);
    } else {
      viewer.classList.remove('fullscreen');
      const target = getTargetRect();
      setRect(shell, target);
      setRect(halo, getHaloRect(activePointRect, target));
      setBubblePosition(target, activeRegion, true);
    }
    updateModeIndicator();
  }

  function getHaloRect(fromRect, targetRect) {
    const cx = fromRect.left + fromRect.width / 2;
    const cy = fromRect.top + fromRect.height / 2;
    const radius = Math.max(targetRect.width, targetRect.height) * 1.25;

    return {
      left: cx - radius / 2,
      top: cy - radius / 2,
      width: radius,
      height: radius
    };
  }

  function setRect(el, rect) {
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.width = rect.width + 'px';
    el.style.height = rect.height + 'px';
  }

  function animateZoneElement(drawFrame, duration) {
    return new Promise((resolve) => {
      const start = performance.now();

      function step(now) {
        const progress = Math.min(1, (now - start) / duration);
        drawFrame(progress);
        if (progress < 1) {
          requestAnimationFrame(step);
          return;
        }
        resolve();
      }

      requestAnimationFrame(step);
    });
  }

  function easeInOutCubic(value) {
    if (value < 0.5) {
      return 4 * value * value * value;
    }
    return 1 - (Math.pow(-2 * value + 2, 3) / 2);
  }

  function easeOutQuad(value) {
    return 1 - ((1 - value) * (1 - value));
  }

  function createZoneFlight(rect) {
    const zoneFlight = document.createElement('div');
    const originX = (zoneCentroid.x / 2118) * rect.width;
    const originY = (zoneCentroid.y / 1328) * rect.height;

    zoneFlight.className = 'zone-flight';
    zoneFlight.style.left = `${rect.left}px`;
    zoneFlight.style.top = `${rect.top}px`;
    zoneFlight.style.width = `${rect.width}px`;
    zoneFlight.style.height = `${rect.height}px`;
    zoneFlight.style.transformOrigin = `${originX}px ${originY}px`;
    zoneFlight.style.transform = 'translate(0px, 0px) scale(1)';
    zoneFlight.innerHTML = `
      <svg viewBox="0 0 2118 1328" aria-hidden="true" focusable="false">
        <path fill="#8B5E3C" fill-opacity="0.82" stroke="#5F3F28" stroke-width="2" fill-rule="evenodd" d="${zonePathD}"></path>
      </svg>
    `;

    document.body.appendChild(zoneFlight);

    return {
      zoneFlight,
      originX,
      originY
    };
  }

  async function playPointLaunch(pointEl, pointer = null) {
    const zoneRect = layerSvg.getBoundingClientRect();
    const targetRect = pointToRect(pointEl);
    const targetCenterX = pointer?.clientX ?? (targetRect.left + (targetRect.width / 2));
    const targetCenterY = pointer?.clientY ?? (targetRect.top + (targetRect.height / 2));
    const { zoneFlight, originX, originY } = createZoneFlight(zoneRect);
    const centroidX = zoneRect.left + originX;
    const centroidY = zoneRect.top + originY;
    const finalScale = 0.05;
    let startCenterX = centroidX;
    let startCenterY = centroidY;
    let startTranslateX = 0;
    let startTranslateY = 0;

    if (lastActivatedPoint) {
      const previousPointCenter = rectCenter(pointToRect(lastActivatedPoint));
      startCenterX = previousPointCenter.x;
      startCenterY = previousPointCenter.y;
      startTranslateX = startCenterX - centroidX;
      startTranslateY = startCenterY - centroidY;
      zoneFlight.style.transform = `translate(${startTranslateX}px, ${startTranslateY}px) scale(${finalScale})`;
      zoneFlight.style.opacity = '0.82';
    } else {
      await animateZoneElement((progress) => {
        const eased = easeInOutCubic(progress);
        const scale = 1 + ((finalScale - 1) * eased);
        zoneFlight.style.transform = `translate(0px, 0px) scale(${scale})`;
        zoneFlight.style.opacity = `${0.92 - (0.1 * eased)}`;
      }, 500);
      startTranslateX = 0;
      startTranslateY = 0;
    }

    const deltaX = targetCenterX - startCenterX;
    const deltaY = targetCenterY - startCenterY;
    const lift = Math.max(70, Math.min(220, (Math.abs(deltaX) * 0.18) + 40));
    const controlX = deltaX * 0.5;
    const controlY = (deltaY * 0.5) - lift;

    await animateZoneElement((progress) => {
      const eased = easeOutQuad(progress);
      const inverse = 1 - eased;
      const curveX = (inverse * inverse * 0) + (2 * inverse * eased * controlX) + (eased * eased * deltaX);
      const curveY = (inverse * inverse * 0) + (2 * inverse * eased * controlY) + (eased * eased * deltaY);
      const translateX = startTranslateX + curveX;
      const translateY = startTranslateY + curveY;

      zoneFlight.style.transform = `translate(${translateX}px, ${translateY}px) scale(${finalScale})`;
      zoneFlight.style.opacity = `${0.82 - (0.26 * eased)}`;
    }, 500);

    zoneFlight.remove();
  }

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function pickRegionFromPointer(event, rect, regions) {
    if (!regions || !regions.length) return null;

    const rx = (event.clientX - rect.left) / rect.width;
    const regionIndex = rx < 0.5 ? 0 : 1;
    const region = regions[regionIndex] || regions[0] || null;

    return region ? { ...region, _zoneKey: `zone-${regionIndex}` } : null;
  }

  function setBubblePosition(videoRect, region = null, randomize = false) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const gap = 24;

    if (vw <= 700) {
      infoBubble.style.top = Math.min(vh - 170, videoRect.top + videoRect.height + 18) + 'px';
      infoBubble.style.setProperty('--tail-top', '0px');
      infoBubble.style.setProperty('--tail-rotate', '90deg');
      return;
    }

    const bubbleWidth = Math.min(340, Math.max(240, vw * 0.28));
    const bubbleHeightEstimate = 150;

    let anchorY = videoRect.top + videoRect.height * 0.5;
    if (region) {
      anchorY = videoRect.top + videoRect.height * region.y;
    }

    if (!region) {
      let left = videoRect.left + videoRect.width + gap;
      if (left + bubbleWidth > vw - 24) {
        left = vw - bubbleWidth - 24;
      }
      let top = Math.max(24, Math.min(anchorY - bubbleHeightEstimate * 0.38, vh - bubbleHeightEstimate - 24));
      infoBubble.style.left = left + 'px';
      infoBubble.style.top = top + 'px';
      infoBubble.style.setProperty('--tail-top', '38px');
      infoBubble.style.setProperty('--tail-rotate', '-18deg');
      return;
    }

    if (randomize || !region._bubblePlacement) {
      let left = videoRect.left + videoRect.width + gap + randomBetween(-10, 16);
      if (left + bubbleWidth > vw - 24) {
        left = vw - bubbleWidth - 24;
      }

      let top = anchorY - bubbleHeightEstimate * 0.38 + randomBetween(-12, 12);
      top = Math.max(24, Math.min(top, vh - bubbleHeightEstimate - 24));

      const tailTop = Math.max(18, Math.min(anchorY - top - 10, bubbleHeightEstimate - 22));
      const tailRotate = randomBetween(-26, -8).toFixed(1) + 'deg';

      region._bubblePlacement = { left, top, tailTop, tailRotate };
    }

    const placement = region._bubblePlacement;
    infoBubble.style.left = placement.left + 'px';
    infoBubble.style.top = placement.top + 'px';
    infoBubble.style.setProperty('--tail-top', placement.tailTop + 'px');
    infoBubble.style.setProperty('--tail-rotate', placement.tailRotate);
  }

  function clearBubbleTimer() {
    if (hideBubbleTimer) {
      clearTimeout(hideBubbleTimer);
      hideBubbleTimer = null;
    }
  }

  function hideBubble(immediate = false) {
    clearBubbleTimer();
    bubbleVisible = false;
    infoBubble.classList.remove('visible');
    if (immediate) return;
  }

  function showBubble(event = null) {
    if (!isOpen || !activePointData) return;
    clearBubbleTimer();

    const rect = shell.getBoundingClientRect();
    const region = event ? pickRegionFromPointer(event, rect, activeRegions) : (activeRegion || activeRegions[0]);
    const resolvedRegion = region || activeRegions[0] || {
      label: 'Observation',
      title: activePointData.title,
      text: activePointData.text,
      y: 0.5,
      _zoneKey: 'default-zone'
    };

    const zoneChanged = activeZoneKey !== resolvedRegion._zoneKey;
    const shouldReposition = zoneChanged || !bubbleVisible;

    activeRegion = resolvedRegion;
    activeZoneKey = resolvedRegion._zoneKey;

    infoZoneLabel.textContent = resolvedRegion.label || 'Observation';
    infoTitle.textContent = resolvedRegion.title || activePointData.title;
    const activeInfo = getActiveVariantInfo();
    infoText.innerHTML = resolvedRegion.html || activeInfo.html || activePointData.html || escapeHtml(resolvedRegion.text || activePointData.text);

    if (shouldReposition) {
      setBubblePosition(getTargetRect(), activeRegion, zoneChanged || !activeRegion._bubblePlacement);
    }

    requestAnimationFrame(() => {
      infoBubble.classList.add('visible');
      bubbleVisible = true;
    });
  }

  function scheduleBubbleHide() {
    clearBubbleTimer();
    hideBubbleTimer = setTimeout(() => {
      const hoveredVideo = shell.matches(':hover');
      const hoveredBubble = infoBubble.matches(':hover');
      if (!hoveredVideo && !hoveredBubble) {
        hideBubble();
      }
    }, 140);
  }

  async function openVideo(pointEl, pointer = null) {
    if (openingPoint || isOpen) return;
    openingPoint = true;

    try {
      activePointRect = pointToRect(pointEl);
      activePointData = getPointData(pointEl);

      try {
        activeRegions = JSON.parse(pointEl.dataset.regions || '[]');
      } catch (error) {
        console.error('Impossible de lire data-regions :', error, pointEl.dataset.regions);
        activeRegions = [];
      }

      activeRegion = activeRegions[0] ? { ...activeRegions[0], _zoneKey: 'zone-0' } : null;
      activeZoneKey = null;
      pendingInitialBubble = true;
      try {
        await playPointLaunch(pointEl, pointer);
      } catch (error) {
        console.error('Impossible de jouer l animation de lancement :', error);
      }

      viewer.style.display = 'block';
      viewer.style.pointerEvents = 'auto';
      viewer.setAttribute('aria-hidden', 'false');
      isFullscreenMode = false;
      viewer.classList.remove('fullscreen');

      const target = getTargetRect();
      setRect(shell, activePointRect);
      setRect(halo, activePointRect);
      setBubblePosition(target, activeRegion);
      hideBubble(true);
      updateModeIndicator();
      updateModeIndicator();

      activeVariants = Array.isArray(activePointData.variants) && activePointData.variants.length > 0
        ? activePointData.variants
        : [{ webm: activePointData.video, jpeg: activePointData.jpeg, poeticText: [], scientificText: [], latitude: null, longitude: null, date: null, game: null }];
      console.log('openVideo variants', activeVariants);
      activeVariantIndex = 0;
      setActiveVariant(0);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          viewer.classList.add('open');
          setRect(shell, target);
          setRect(halo, getHaloRect(activePointRect, target));
          if (!viewer.classList.contains('image-mode')) {
            video.play().catch(() => {});
          }
          isOpen = true;
          lastActivatedPoint = pointEl;
          openingPoint = false;

          requestAnimationFrame(() => {
            if (pendingInitialBubble) {
              const centerX = target.left + target.width * 0.25;
              const centerY = target.top + target.height * 0.5;
              showBubble({ clientX: centerX, clientY: centerY });
              pendingInitialBubble = false;
            }
          });
        });
      });
    } catch (error) {
      openingPoint = false;
      throw error;
    }
  }

  function closeVideo() {
    if (!isOpen || !activePointRect) return;

    pendingInitialBubble = false;
    hideBubble(true);
    viewer.classList.remove('open');
    viewer.classList.remove('fullscreen');
    isFullscreenMode = false;
    setRect(shell, activePointRect);
    setRect(halo, activePointRect);

    setTimeout(() => {
      try {
        video.pause();
        video.removeAttribute('src');
        video.load();
      } catch (e) {}
      try {
        if (imageEl) {
          imageEl.removeAttribute('src');
          imageEl.style.display = 'none';
        }
      } catch (e) {}
      viewer.classList.remove('image-mode');
      viewer.style.display = 'none';
      viewer.style.pointerEvents = 'none';
      viewer.setAttribute('aria-hidden', 'true');
      isOpen = false;
      activePointData = null;
      activeRegion = null;
      activeZoneKey = null;
    }, 940);
  }

  points.forEach((point) => {
    point.addEventListener('click', (e) => {
      e.stopPropagation();
      openVideo(point, e);
    });
  });
  if (variantPrevBtn) {
    variantPrevBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      setActiveVariant(activeVariantIndex - 1);
    });
  }
  if (variantNextBtn) {
    variantNextBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      setActiveVariant(activeVariantIndex + 1);
    });
  }

  shell.addEventListener('mouseenter', (e) => {
    if (!isFullscreenMode) showBubble(e);
  });

  shell.addEventListener('wheel', (event) => {
    if (!isOpen) return;
    event.preventDefault();
    const shouldFullscreen = event.deltaY < 0;
    setFullscreenMode(shouldFullscreen);
  });

  if (modeIndicator) {
    modeIndicator.addEventListener('click', (event) => {
      event.stopPropagation();
      setFullscreenMode(!isFullscreenMode);
    });
  }

  shell.addEventListener('mousemove', (e) => {
    if (isFullscreenMode) return;
    const rect = shell.getBoundingClientRect();
    const hoveredRegion = pickRegionFromPointer(e, rect, activeRegions);
    if (!hoveredRegion) return;

    if (hoveredRegion._zoneKey !== activeZoneKey) {
      showBubble(e);
    }
  });

  shell.addEventListener('mouseleave', () => {
    scheduleBubbleHide();
  });

  infoBubble.addEventListener('mouseenter', () => {
    clearBubbleTimer();
    if (!bubbleVisible) showBubble();
  });

  infoBubble.addEventListener('mouseleave', () => {
    scheduleBubbleHide();
  });

  closeZone.addEventListener('click', closeVideo);
  backdrop.addEventListener('click', closeVideo);
  closeBtn.addEventListener('click', closeVideo);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeVideo();
  });

  window.addEventListener('resize', () => {
    setMapState(mapState);
    if (!viewer.style.display || viewer.style.display === 'none') return;
    if (isOpen) {
      if (isFullscreenMode) {
        const fullscreenRect = getFullscreenRect();
        setRect(shell, fullscreenRect);
        if (activeRegion) {
          setBubblePosition(fullscreenRect, activeRegion, false);
        }
      } else {
        const target = getTargetRect();
        setRect(shell, target);
        if (activeRegion) {
          setBubblePosition(target, activeRegion, false);
        }
      }
    }
  });

  function getSavedAudioVolume() {
    const saved = localStorage.getItem('siteBaladeChampvertAudioVolume');
    const parsed = parseFloat(saved);
    return Number.isFinite(parsed) && parsed >= 0 && parsed <= 1 ? parsed : 0.55;
  }

  function saveAudioVolume(value) {
    localStorage.setItem('siteBaladeChampvertAudioVolume', String(value));
  }

  function updateAudioToggleState() {
    const isActive = !!audioToggleBtn && audioToggleBtn.classList.contains('active');
    if (!audioToggleBtn || !audioVolumeControl) return;

    audioToggleBtn.classList.toggle('active', isActive);
    audioToggleBtn.setAttribute('aria-pressed', String(isActive));
    audioToggleBtn.setAttribute('aria-label', isActive ? 'Désactiver le son de fond' : 'Activer le son de fond');
    audioVolumeControl.classList.toggle('hidden', !isActive);
    audioVolumeControl.setAttribute('aria-hidden', String(!isActive));
  }

  function setBackgroundAudioVolume(value) {
    const normalized = Math.min(1, Math.max(0, Number(value)));
    if (backgroundAudio) {
      backgroundAudio.volume = normalized;
    }
    if (audioVolumeRange) {
      audioVolumeRange.value = String(normalized);
    }
    saveAudioVolume(normalized);
  }

  function toggleBackgroundAudio() {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const isActive = !audioToggleBtn.classList.contains('active');
    audioToggleBtn.classList.toggle('active', isActive);
    audioToggleBtn.setAttribute('aria-pressed', String(isActive));
    audioToggleBtn.setAttribute('aria-label', isActive ? 'Désactiver le son de fond' : 'Activer le son de fond');
    audioVolumeControl.classList.toggle('hidden', !isActive);
    audioVolumeControl.setAttribute('aria-hidden', String(!isActive));

    if (isActive) {
      backgroundAudio.volume = Number(audioVolumeRange.value) || getSavedAudioVolume();
      backgroundAudio.play().catch((error) => {
        console.warn('Impossible de démarrer le son de fond :', error);
      });
    } else {
      backgroundAudio.pause();
    }
  }

  function initializeBackgroundAudioControls() {
    if (!audioToggleBtn || !audioVolumeControl || !audioVolumeRange || !backgroundAudio) return;

    const startingVolume = getSavedAudioVolume();
    audioVolumeRange.value = String(startingVolume);
    backgroundAudio.volume = startingVolume;
    audioToggleBtn.classList.remove('active');
    audioToggleBtn.setAttribute('aria-pressed', 'false');
    audioToggleBtn.setAttribute('aria-label', 'Activer le son de fond');
    audioVolumeControl.classList.add('hidden');
    audioVolumeControl.setAttribute('aria-hidden', 'true');

    audioToggleBtn.addEventListener('click', (event) => {
      event.preventDefault();
      toggleBackgroundAudio();
    });

    audioVolumeRange.addEventListener('input', (event) => {
      const target = /** @type {HTMLInputElement} */ (event.target);
      if (!target) return;
      setBackgroundAudioVolume(target.value);
    });
  }

  function getSiteInfoText() {
    const strings = localeStrings[currentLocale] || localeStrings.FR;
    return strings.infoTooltipText || '';
  }

  function renderSiteInfoText() {
    const text = getSiteInfoText();
    if (!infoTooltip) return;
    const paragraphs = text
      .split('\n')
      .map((line) => line.trim())
      .filter(Boolean)
      .map((line) => `<p>${escapeHtml(line)}</p>`)
      .join('');
    infoTooltip.innerHTML = paragraphs;
  }

  function showSiteInfoTooltip() {
    if (!infoTooltip) return;
    renderSiteInfoText();
    infoTooltip.classList.add('visible');
    infoTooltip.setAttribute('aria-hidden', 'false');
  }

  function hideSiteInfoTooltip() {
    if (!infoTooltip) return;
    infoTooltip.classList.remove('visible');
    infoTooltip.setAttribute('aria-hidden', 'true');
  }

  function initializeSiteInfoControls() {
    if (!infoToggleBtn || !infoTooltip) return;

    infoToggleBtn.addEventListener('mouseenter', () => showSiteInfoTooltip());
    infoToggleBtn.addEventListener('focus', () => showSiteInfoTooltip());
    infoToggleBtn.addEventListener('mouseleave', () => {
      window.setTimeout(() => {
        if (!infoToggleBtn.matches(':hover') && !infoTooltip.matches(':hover')) {
          hideSiteInfoTooltip();
        }
      }, 100);
    });

    infoTooltip.addEventListener('mouseenter', () => showSiteInfoTooltip());
    infoTooltip.addEventListener('mouseleave', () => {
      window.setTimeout(() => {
        if (!infoToggleBtn.matches(':hover') && !infoTooltip.matches(':hover')) {
          hideSiteInfoTooltip();
        }
      }, 100);
    });
  }

  updateMapToggleText();
  applyMapTransform();
  loadPoiData();
  initializeBackgroundAudioControls();
  initializeSiteInfoControls();
  runIntro();
</script>
</body>
